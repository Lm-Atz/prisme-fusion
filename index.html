<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prisme Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* avoid-ai-design-ignore-file: C1, M4 */
/* Choix assumés : C1 (le violet est l'une des six couleurs du spectre : c'est le sujet du jeu, pas un dégradé par défaut) */
/* M4 (jeu mobile : les rebonds sont voulus, ils répondent aux actions du joueur) */
/* Nuit prismatique. Le jeu tourne en continu ;
   un seul écran : arène + plateau-écrin + boosters. La couleur vient du spectre des pièces ; l'interface reste en dalles indigo mates. */
:root{
  --night:#0d1530; --night-2:#142042; --slab:#1b2a55; --slab-hi:#24376b; --edge:#080d22; --line:#2f4380;
  --light:#fff6e4; --mist:#bfcbe8; --faint:#8391bb;
  --beam:#ffc857; --beam-hi:#ffe3a1; --beam-edge:#b8700f; --on-beam:#3b2000;
  --gem:#d48cff; --gem-edge:#6d2fa6; --shard:#7fe2ff; --shard-edge:#1f7c9c;
  --ok:#7df0b0; --danger:#ff5a6e;
  --s1:#ff5e7e; --s2:#ffb347; --s3:#ffe66d; --s4:#6cf0c2; --s5:#5ec8ff; --s6:#9d7bff;
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --wh:#5ec8ff;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--light);font:600 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(120% 55% at 50% -14%,rgba(255,214,150,.20),transparent 62%),
  linear-gradient(112deg,transparent 36%,rgba(255,94,126,.07) 41%,rgba(255,179,71,.07) 44%,rgba(255,230,109,.06) 47%,rgba(108,240,194,.06) 50%,rgba(94,200,255,.07) 53%,rgba(157,123,255,.07) 56%,transparent 61%)}
section{position:relative;z-index:1}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px}
.i{width:1.15em;height:1.15em;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ie{color:var(--beam)}.ig{color:var(--gem)}.is{color:var(--shard)}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px}

/* ---------- boutons en relief ---------- */
.b{--f:var(--slab-hi);--f2:var(--slab);--e:var(--edge);--t:var(--light);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:14px;margin-bottom:5px;
  background:linear-gradient(180deg,var(--f),var(--f2));color:var(--t);font:18px/1 var(--display);cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 5px 0 var(--e);transition:transform 70ms ease-out,box-shadow 70ms ease-out}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 var(--e)}
.b:disabled{filter:grayscale(.85) brightness(.72);cursor:default}
.b .i{color:inherit}
.b-gold{--f:#ffdf99;--f2:var(--beam);--e:var(--beam-edge);--t:var(--on-beam)}
.b-gem{--f:#e8bbff;--f2:#b865f0;--e:var(--gem-edge);--t:#2a0a45}
.b-shard{--f:#bff2ff;--f2:#58c9ec;--e:var(--shard-edge);--t:#06283a}
.b-red{--f:#ff9aa8;--f2:var(--danger);--e:#8f1d2e;--t:#3a0710}
.b.sm{font-size:16px;padding:0 12px;border-radius:12px}
.b small{font:800 12px var(--body);display:inline-flex;align-items:center;gap:2px;opacity:.85}

/* ---------- barre des monnaies ---------- */
.top{display:flex;gap:8px;justify-content:space-between;padding-block:10px 2px}
.pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:0;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--light);font:18px var(--display);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}
.pill .i{width:30px;height:30px}
.pill small{font:800 12px var(--body);color:var(--mist);white-space:nowrap}
.pill .plus{width:18px;height:18px;border-radius:50%;background:var(--gem);color:#2a0a45;display:grid;place-items:center}
.pill .plus .i{width:12px;height:12px}

.oc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge));box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--edge);transition:transform 70ms ease-out}
.oc .i{width:32px;height:32px}
@keyframes hot{to{box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--beam-edge),0 0 26px rgba(255,200,87,.9)}}
.badge{position:absolute;top:6px;right:calc(50% - 24px);width:13px;height:13px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 3px var(--night)}
.ptier{color:var(--mist);font-size:13px;margin-top:-4px;text-align:center}
/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,var(--night-2),var(--edge));box-shadow:0 -2px 0 var(--line)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:0;color:var(--mist);font:800 12px var(--body);cursor:pointer}
.nav button .i{width:27px;height:27px;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.nav button[aria-selected="true"]{color:var(--light)}
.nav button[aria-selected="true"] .i{color:var(--beam);transform:translateY(-3px) scale(1.14)}

/* ---------- onglets ---------- */
.phead{padding:10px 2px 6px}
.ttl{font:32px/1 var(--display);margin:0}
.sub{margin:4px 0 0;color:var(--mist);font-size:14px}
h2.sec{font:21px var(--display);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font:800 13px var(--body);color:var(--mist)}
.note{color:var(--mist);font-size:13px;margin:8px 2px}
.slab{background:linear-gradient(180deg,var(--slab-hi),var(--slab));border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge)}
.list{display:flex;flex-direction:column;gap:10px}
/* atelier */
.slot{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.slot.empty{display:flex;min-height:60px;gap:10px;padding:0 14px;border-radius:16px;border:2px dashed var(--line);color:var(--mist);font-weight:800;font-size:14px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--night-2) 60%,transparent 62%),conic-gradient(var(--beam) var(--p,0%),var(--edge) 0)}
.ring .i{width:26px;height:26px}
.slot b{display:block;font:17px/1.1 var(--display)}
.slot .tm{display:inline-flex;align-items:center;gap:4px;color:var(--beam);font-weight:800;font-size:14px}
.slot-acts{display:flex;flex-direction:column;gap:2px}
.slotbuy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mist);font-size:13px}
.grp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.grp button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--mist);font:800 12px var(--body);cursor:pointer;padding:0 2px}
.grp button .i{width:24px;height:24px}
.grp button[aria-pressed="true"]{background:linear-gradient(180deg,var(--slab-hi),var(--slab));color:var(--light);box-shadow:inset 0 0 0 2px var(--beam)}
.grp .badge{top:4px;right:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:0}
.tile[data-g="atk"]{--gc:var(--s1)}.tile[data-g="grid"]{--gc:var(--s5)}.tile[data-g="def"]{--gc:var(--s4)}.tile[data-g="eco"]{--gc:var(--s2)}.tile[data-g="jok"]{--gc:var(--s6)}
.tile-top{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:8px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.tico{grid-row:1/3;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 70%,#fff),color-mix(in srgb,var(--gc) 75%,#000));color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tico .i{width:26px;height:26px}
.tname{font:16px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis}
.tlvl{font-size:12.5px;color:var(--mist);font-weight:800}
.pips{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.pips i{display:block;height:100%;background:var(--gc,var(--beam))}
.tile .b{width:100%;justify-content:space-between;padding:0 10px}
.tstate{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--edge);color:var(--mist);font-weight:800;font-size:13px;margin-bottom:5px}
.tstate.run{color:var(--beam)}
.tile.locked .tico{filter:grayscale(1);opacity:.55}
.tile.locked .tname{color:var(--mist)}
.jcard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px}
.jcard.on{box-shadow:inset 0 0 0 2px var(--gem),0 4px 0 var(--edge)}
.jart{width:58px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);background:linear-gradient(160deg,#f3d3ff,#8e45d0);color:#2a0a45}
.jart .i{width:30px;height:30px}
.jcard.locked .jart{background:linear-gradient(160deg,#34498a,#18264f);color:var(--faint)}
.jcard b{font:19px var(--display)}
.jl{font-size:12.5px;color:var(--gem);font-weight:800;margin-left:6px}
.jcard p{margin:4px 0 0;color:var(--mist);font-size:13.5px}
.jcard .jmeta{color:var(--light);font-weight:800;font-size:13px}
.jbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.jbtns .d{color:var(--beam);font-weight:800;font-size:13px;display:inline-flex;gap:4px;align-items:center}
/* quêtes */
.quest{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px}
.quest.hl{box-shadow:inset 0 0 0 2px var(--beam),0 4px 0 var(--edge)}
.quest.done{opacity:.55}
.qic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--edge);color:var(--mist)}
.qic .i{width:22px;height:22px}
.quest.hl .qic{background:var(--beam);color:var(--on-beam)}
.quest.hl .qbar span{color:var(--on-beam);text-shadow:none}
.qbody b{display:block;font-weight:800;font-size:15px;line-height:1.25}
.qbar{position:relative;height:18px;border-radius:9px;background:var(--edge);overflow:hidden;margin:6px 0}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,var(--beam-hi),var(--beam));border-radius:9px}
.qbar span{position:relative;display:block;text-align:center;font:800 12px/18px var(--body);text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.rew{display:inline-flex;gap:6px;flex-wrap:wrap}
.rew span{display:inline-flex;align-items:center;gap:3px;background:var(--edge);border-radius:999px;padding:3px 9px 3px 5px;font-weight:800;font-size:13px}
.chap{height:12px;border-radius:6px;background:var(--edge);overflow:hidden;margin:0 2px 12px}
.chap i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
/* ligue */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:10px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod canvas{width:40px;height:40px}
.pod .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:30px var(--display);color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.pod.p1 .blk{height:88px;background:linear-gradient(180deg,var(--beam-hi),var(--beam))}
.pod.p2 .blk{height:68px;background:linear-gradient(180deg,#eef0ff,#b9bde8)}
.pod.p3 .blk{height:54px;background:linear-gradient(180deg,#ffd0a8,#e08b52)}
.lg{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto 44px;gap:8px;align-items:center;min-height:48px;padding:0 4px 0 10px;border-radius:12px;background:var(--night-2)}
.lg.me{background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 0 0 2px var(--beam)}
.lg .rk{font:17px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg.up .rk{color:var(--ok)}.lg.down .rk{color:var(--danger)}
.lg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.lg .sc{font:16px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg canvas{width:26px;height:26px}
.zone{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:6px 4px}
.zone.upz{color:var(--ok)}.zone.downz{color:var(--danger)}
.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35;border-radius:1px}
.rep{width:44px;height:44px;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;border-radius:12px}
.rep:disabled{color:var(--ok)}
/* boutique */
.offer{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.oart{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle at 40% 30%,var(--slab-hi),var(--edge))}
.oart .i{width:40px;height:40px}
.offer b,.gitem b{font:18px/1.1 var(--display)}
.offer p{margin:3px 0 0;color:var(--mist);font-size:13px}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 10px 8px;min-width:0}
.gitem .oart{width:56px;height:56px}
.gitem p{margin:0;color:var(--mist);font-size:12.5px;min-height:3em}
.gitem .b{width:100%}
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font:800 12.5px var(--body);min-height:44px}
.skin[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--beam)}
.skin canvas{width:40px;height:40px}
.skin span{color:var(--mist)}
.demo{color:var(--mist);font-size:13px;display:flex;gap:6px;align-items:center}
/* profil */
.field{display:flex;gap:8px;align-items:flex-start}
.field input{flex:1;min-width:0;min-height:46px;background:var(--edge);border:2px solid var(--line);border-radius:14px;padding:0 12px;color:var(--light);font:700 16px var(--body)}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:4px 2px 0;font-weight:800}
.switch{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 14px;font-weight:800;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.switch input:checked{background:var(--ok);box-shadow:none}
.switch input:checked::after{transform:translateX(22px);background:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px}
.stat b{display:block;font:22px var(--display)}
.stat span{color:var(--mist);font-size:12.5px;font-weight:800}
.best{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;background:var(--night-2);font-weight:800}
.best .i{color:var(--beam)}
.best span:last-child{color:var(--mist);font-size:13px}

/* ---------- modales ---------- */
.veil{position:fixed;inset:0;background:rgba(6,10,28,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:100%;max-width:380px;border-radius:26px;padding:22px 20px 16px;background:linear-gradient(180deg,#2a3f7a,var(--slab));box-shadow:inset 0 2px 0 rgba(255,255,255,.16),0 6px 0 var(--edge);text-align:center;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;animation:mpop 280ms cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{from{transform:scale(.86);opacity:0}}
.modal h2{font:29px/1.05 var(--display);margin:0}
.modal p{margin:0;color:var(--mist)}
.modal .big{font:44px/1 var(--display);color:var(--shard);font-variant-numeric:tabular-nums}
.modal .loot{display:inline-flex;align-items:center;gap:6px;font:24px var(--display);color:var(--shard);justify-content:center}
.modal .loot .i{width:30px;height:30px}
.mart{display:grid;place-items:center}
.mart .i{width:66px;height:66px}
.acts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.acts .b{width:100%}
.acts .row{display:flex;gap:8px}.acts .row .b{flex:1}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px}
.stars span .i{width:54px;height:54px;color:var(--edge)}
.stars span:nth-child(2) .i{width:66px;height:66px}
.stars .on .i{color:var(--beam);animation:starpop 460ms cubic-bezier(.34,1.56,.64,1) both}
.stars .on:nth-child(2) .i{animation-delay:.16s}.stars .on:nth-child(3) .i{animation-delay:.32s}
@keyframes starpop{from{transform:scale(0) rotate(-45deg)}}
.ad{font:68px/1 var(--display);color:var(--beam)}
.login{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ltile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--edge);font-size:12.5px;font-weight:800;min-height:56px;justify-content:center}.ltile small{color:var(--mist);font-size:11.5px}.ltile span{display:inline-flex;align-items:center;gap:3px}.ltile.past{opacity:.45}.ltile.today{box-shadow:inset 0 0 0 2px var(--beam);background:var(--slab-hi)}.ltile:last-child{grid-column:span 1}
.fly{position:fixed;left:0;top:0;width:24px;height:24px;z-index:30;pointer-events:none;filter:drop-shadow(0 0 6px rgba(127,226,255,.9))}.fly .i{width:24px;height:24px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--light);color:var(--night);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
/* ---------- écran unique : jeu ---------- */
body{margin:0}
#game{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--navh,calc(60px + var(--sab)))}
.gwrap{max-width:480px;width:100%;margin:0 auto;padding:8px 16px 8px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.arena{position:relative;flex:none;display:flex;flex-direction:column;gap:4px}
#bossCv{width:100%;height:clamp(96px,19vh,200px);display:block}
.stg{position:absolute;left:0;top:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;padding:2px 0 2px 4px}
.quick{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.qb{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;color:var(--mist)}
.qb span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(13,21,48,.75);box-shadow:inset 0 0 0 2px var(--line);transition:transform 70ms ease-out}
.qb span .i{width:18px;height:18px}
.qb:active:not(:disabled) span{transform:scale(.92)}
.qb:disabled{opacity:.35;cursor:default}
.qb.on{color:var(--beam)}.qb.on span{box-shadow:inset 0 0 0 2px var(--beam)}
.qb i{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--beam);box-shadow:0 0 0 2px var(--night)}
.qb.hot{color:var(--danger)}.qb.hot span{box-shadow:inset 0 0 0 2px var(--danger);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.stg b{font:19px/1 var(--display)}
.stg small{display:block;font:800 12.5px var(--body);color:var(--mist);margin-top:2px}
.stg .tmr{font:22px/1 var(--display);color:var(--beam);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.stg .tmr.late{color:var(--danger)}
.stg .tmr .i{width:20px;height:20px}
.hp{position:relative;height:10px;border-radius:5px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0}
#hpLag{background:#fff;opacity:.6}
#hpBar{background:linear-gradient(180deg,#ff9aa8,var(--danger));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.hp.titan #hpBar{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
.hp.shield{box-shadow:inset 0 0 0 2px var(--shard)}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:26px/1.1 var(--display);color:#fff;text-align:center;pointer-events:none;background:var(--slab-hi);border-radius:16px;padding:10px 18px;box-shadow:0 5px 0 var(--edge);animation:tin 260ms cubic-bezier(.34,1.56,.64,1);max-width:90%}
.banner small{display:block;font:800 13px var(--body);color:var(--mist);margin-top:3px}
.banner.boss{background:var(--danger);box-shadow:0 5px 0 #8f1d2e}.banner.boss small{color:#ffd6dc}
.banner.gold{background:var(--beam);color:var(--on-beam);box-shadow:0 5px 0 var(--beam-edge)}.banner.gold small{color:#5b3a00}
.boardwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--wh) 16%,transparent),transparent 70%)}
#board{display:block;touch-action:none;border-radius:20px}
.hint{background:var(--light);color:var(--night);border-radius:14px;padding:9px 12px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
/* jokers */
.jok{display:flex;gap:8px;justify-content:center}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--light);cursor:pointer;width:60px;padding:0;font:800 12px var(--body)}
.tool .oc{width:48px;height:48px}
.tool .oc .i{width:24px;height:24px}
.tool:active .oc{transform:translateY(3px) scale(.96)}
.tool small{font:800 12px var(--body);color:var(--mist)}
.jtool .oc{border:4px solid transparent;box-shadow:0 4px 0 var(--edge);background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge)) padding-box,conic-gradient(var(--gem) var(--p,0%),var(--line) 0) border-box;color:var(--gem)}
.jtool.ready .oc{background:radial-gradient(circle at 35% 30%,#f3d3ff,#8e45d0) padding-box,conic-gradient(var(--gem) 100%,var(--gem) 0) border-box;color:#2a0a45;animation:jready 650ms ease-in-out infinite alternate}
.jtool.ready small{color:var(--gem)}
@keyframes jready{to{transform:scale(1.08)}}
/* boosters temporaires */
.sparks{display:flex;justify-content:center;align-items:baseline;gap:10px;padding:0 2px}
.sparks b{display:inline-flex;align-items:center;gap:5px;font:22px/1 var(--display);color:var(--beam);font-variant-numeric:tabular-nums}
.sparks b .i{width:24px;height:24px}
.sparks small{font:800 12.5px var(--body);color:var(--mist)}
.tb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tbt{--tc:var(--beam);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:8px 2px 6px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge);color:var(--light);cursor:pointer;font:800 12px var(--body);transition:transform 70ms ease-out,box-shadow 70ms ease-out;min-width:0}
.tbt .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 70%,#fff),color-mix(in srgb,var(--tc) 70%,#000));color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tbt .ico .i{width:20px;height:20px}
.tbt .lv{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--edge);color:var(--mist);font:12px/18px var(--display)}
.tbt .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:12px}
.tbt b{display:inline-flex;align-items:center;gap:2px;font:14px/1 var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.tbt b .i{width:12px;height:12px}
.tbt:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 var(--edge)}
.tbt.ok{background:linear-gradient(180deg,#ffdf99,var(--beam));color:var(--on-beam);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--beam-edge)}
.tbt.ok b{color:var(--on-beam)}.tbt.ok .lv{background:rgba(59,32,0,.25);color:var(--on-beam)}
.tbt.ok:active:not(:disabled){box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 1px 0 var(--beam-edge)}
.tbt:disabled{cursor:default;opacity:.5}
.tbt.hot{animation:hot 1.2s ease-in-out infinite alternate}
.tbt.shake{animation:shake 300ms ease-in-out}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* actions */
@media (max-height:740px){
  .top{padding-block:6px 0}#bossCv{height:clamp(80px,15vh,140px)}.tbt{min-height:70px;padding-top:6px}.tbt .ico{width:28px;height:28px}.tbt .ico .i{width:16px;height:16px}
  .nav button{min-height:52px}
}
/* ---------- panneaux (atelier, quêtes, ligue, boutique, profil) ---------- */
#panel{position:fixed;inset:0;z-index:4;background:var(--night);overflow:auto;padding-top:var(--sat);padding-bottom:calc(6px + var(--navh,calc(56px + var(--sab))))}
#panel::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% -14%,rgba(255,214,150,.20),transparent 62%)}
#panel .wrap{position:relative}
.phead{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;padding:12px 2px 6px}
.phead .quit{grid-column:2;grid-row:1}
.stage{display:flex;flex-direction:column;align-items:center}
#me{width:150px;height:150px;display:block}
.tile[data-g="start"]{--gc:var(--s3)}.tile[data-g="auto"]{--gc:var(--s4)}.tile[data-g="arm"]{--gc:var(--s1)}
.grp{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}.grp::-webkit-scrollbar{display:none}
.grp button{flex:0 0 72px;font-size:12px;min-height:58px;padding:0}
.wpn{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--night-2)}
.wpn canvas{width:44px;height:44px}
.wpn b{font:16px var(--display)}.wpn b span{color:var(--beam);font-size:14px}.wpn b em{font:800 12px var(--body);color:var(--gem);margin-left:6px;font-style:normal}.wpn .b{margin:0;padding:0 10px}
.wpn p{margin:1px 0 0;color:var(--mist);font-size:13px}
.grp button .i{width:22px;height:22px}
.quest{cursor:pointer}
.quest .b{pointer-events:none}
.q-tap{grid-column:3}

#offline{z-index:40}

/* bulle cadeau : apparaît sous les pastilles, à droite */
.gift{position:absolute;right:16px;top:calc(50% - 160px);width:56px;height:56px;border-radius:50%;border:0;padding:0;z-index:3;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffe3a1,var(--beam));box-shadow:0 4px 0 var(--beam-edge),0 0 22px rgba(255,200,87,.6);color:var(--on-beam);animation:giftbob 1.4s ease-in-out infinite alternate}
.gift .i{width:28px;height:28px}
.gift.pop{animation:giftpop 500ms cubic-bezier(.34,1.56,.64,1),giftbob 1.4s 500ms ease-in-out infinite alternate}
@keyframes giftpop{from{transform:scale(0) rotate(-30deg)}}
@keyframes giftbob{to{transform:translateY(-6px)}}
.gwrap{position:relative}
.pips.inf{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6));opacity:.55}

.nav{padding-bottom:var(--sab)}
.veil{padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab))}
#toast{top:calc(64px + var(--sat))}
.b-spark{--f:#fff3b0;--f2:#ffc857;--e:var(--beam-edge);--t:#3a2a06}
.bal{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;font-size:15px;color:var(--mist)}.bal b{font-size:20px;color:var(--light)}.bal .i{width:22px;height:22px}
.code{font:700 15px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;word-break:break-all;background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;user-select:all;text-align:center}
.xin{width:100%;box-sizing:border-box;font:700 16px/1.3 inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--night);color:var(--light)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:auto}
.pill.sm{min-height:44px;padding:0 8px 0 4px;font-size:16px;gap:4px}.pill.sm .i{width:24px;height:24px}.pill.sm .plus{width:16px;height:16px}.pill.sm .plus .i{width:11px;height:11px}
.qb.me{width:44px;height:44px}.qb.me canvas{border-radius:50%;background:var(--night-2);box-shadow:0 0 0 2px var(--line)}.qb.me canvas{width:32px;height:32px;display:block}
</style></head><body>

const $=id=>document.getElementById(id);
const U=()=>I18N[LANG]._units||I18N.fr._units;
function fmt(n){
  if(!isFinite(n))return '∞';
  n=Math.floor(n);
  if(n<10000)return grp(n);
  let e=Math.floor(Math.log10(n)/3);let v=n/Math.pow(10,e*3);
  if(v>=999.5){e++;v=n/Math.pow(10,e*3);}
  const suf=e<=4?U()[e-1]:String.fromCharCode(97+Math.floor((e-5)/26)%26)+String.fromCharCode(97+(e-5)%26);
  return (v<100?dec(v,1):dec(v,0))+'\u202f'+suf;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const dur=s=>{s=Math.max(0,Math.ceil(s));const U=(I18N[LANG]._dur||I18N.fr._dur);if(s<60)return s+' '+U[0];if(s<3600)return Math.ceil(s/60)+' '+U[1];if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+' '+U[2]+(m?' '+String(m).padStart(2,'0'):'');}const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d+' '+U[3]+(h?' '+h+' '+U[2]:'');};
const clock=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekKey(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return dayKey(d.getTime());}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const BAN_SUB=['connard','connasse','salope','salaud','pute','putain','encule','enculer','merde','bite','couille','nique','niquer','batard','enfoire','fuck','shit','bitch','cunt','dick','nigg','negr','nazi','hitler','whore','faggot','pussy','asshole','retard','slut','pedo','viol','tapette','gouine','bougnoul','youpin','chienne','puta','mierda','joder','cabron','maricon','pendejo','scheisse','fotze','hurensohn','arschloch','porra','caralho','viado','buceta','cazzo','stronzo','troia','vaffanculo','frocio'];
const BAN_WORD=['con','conne','pd','fdp','ntm','tg','nazi','cul','fag','kkk','ss'];
function normName(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t');}
function checkName(raw){
  const s=raw.trim().replace(/\s+/g,' ');
  if(s.length<3)return {ok:false,msg:t('name_short')};
  if(s.length>16)return {ok:false,msg:t('name_long')};
  if(!/^[\p{L}\p{N} _-]+$/u.test(s))return {ok:false,msg:t('name_chars')};
  const n=normName(s),words=n.split(/[\s_-]+/).map(w=>w.replace(/[^a-z]/g,'')),flatRaw=n.replace(/[^a-z]/g,''),flat=flatRaw.replace(/(.)\1+/g,'$1');
  if(BAN_SUB.some(b=>flatRaw.includes(b)||flat.includes(b.replace(/(.)\1+/g,'$1')))||words.some(w=>BAN_WORD.includes(w))||BAN_WORD.includes(flatRaw))return {ok:false,msg:t('name_banned')};
  return {ok:true,name:s};
}

const emptyCells=()=>R.cells.map((c,i)=>c?-1:i).filter(i=>i>=0);

  let e=emptyCells();

    const n=1+S.up.sursis;const small=shapes().sort((a,b)=>a[0].l-b[0].l).slice(0,n);if(!small.length)return -1;small.forEach(([c,i])=>{R.cells[i]=null;hooks.bomb(i,[i]);});e=emptyCells();}
  const i=e[Math.floor(Math.random()*e.length)];

const nb=i=>{const N=R.N,x=i%N,y=Math.floor(i/N),o=[];if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);return o;};
function bossAttack(){

function pushWin(arr,t,v,w=CFG.offline.rateWindow){arr.push([t,v]);while(arr.length&&arr[0][0]<t-w)arr.shift();}

  for(let i=0;i<R.cells.length;i++){const c=R.cells[i];if(!c)continue;if(c.fog&&c.fog<=R.t)delete c.fog;if(c.k==='lock'&&c.until<=R.t){R.cells[i]=null;hooks.unlock(i);}}

function autoMerge(){const seen={};const o=shapes().filter(x=>!x[0].fog).sort((a,b)=>a[0].l-b[0].l);for(const [c,i] of o){if(seen[c.l]!=null){runMove(seen[c.l],i,false);return true;}seen[c.l]=i;}

function applyDamage(into,d,crit,w,silent){

function fireRate(){const c=R.comboT>0?1+(0.05+0.01*S.up.combo)*R.combo:1;return (1+0.05*S.up.cadence)*c*(R.t<R.surgeUntil?2:1);}
function fireOne(i,C){
  const E=R.E,l=C.l,w=weaponOf(l),p=effectPow(l);
  if(E.shieldL&&l<E.shieldL&&R.t>=R.breakUntil&&w.id!=='sq'){hooks.hit(i,0,true,false,w);return;}
  let d=dmgOf(l)*w.k*powerMult()*wpDmg(l);
  if(E.type==='boss')d*=Math.pow(1.15,S.up.bossdmg);
  if(w.id==='dia'){}else{for(const j of nb(i)){const B=R.cells[j];if(B&&B.l&&weaponOf(B.l).id==='dia')d*=1+(0.25+0.1*S.up.aura)*effectPow(B.l);}}
  let crit=Math.random()<0.02*S.up.crit;if(w.id==='hep'&&Math.random()<Math.min(0.9,0.25*p))crit=true;if(crit)d*=3;
  if(w.id==='pen'){R.burn={dps:Math.max(R.burn&&R.burn.until>R.t?R.burn.dps:0,d*0.35*p),until:R.t+3+S.up.brule};}

function fireTick(dt){

}
function doMerge(into,l,gold,manual){
  R.cells[into]={l};if(gold)R.cells[into].k='gold';
  S.st.merges++;S.day.merges++;if(manual){S.st.manual++;R.combo=Math.min(R.combo+1,30);R.comboT=3;if(R.combo>S.st.maxCombo)S.st.maxCombo=R.combo;if(R.combo>(S.day.combo||0))S.day.combo=R.combo;}

  for(const j of nb(into))if(R.cells[j]&&R.cells[j].k==='lock'){R.cells[j]=null;hooks.unlock(j);}
  hooks.merge(into,l,gold,manual);

}
const jokerCap=()=>spawnLevel()+1+(S.jk.chameleon||1);
function runMove(a,b,manual=true){

  if(!A||A.k==='lock')return 'none';

/* cible aimantée : la gemme compatible la plus proche du point de dépôt (rayon 0,6 case) */
function snapTarget(from,x,y){

  for(let i=0;i<R.cells.length;i++){const B=R.cells[i];if(i===from||!B||B.k==='lock')continue;

function drawMe(c,size,t,dt){

  const s=size/190;c.scale(s,s);
  const tr=tierOf(S.bestStage),h=skinHue(t),L=layers();
  fx.evolveT=Math.max(0,fx.evolveT-dt*0.8);

  c.fillStyle=beam;c.beginPath();c.moveTo(80,0);c.lineTo(110,0);c.lineTo(150,150);c.lineTo(40,150);c.closePath();c.fill();

  SPEC.forEach((col,i)=>{c.fillStyle=`rgba(${col},.30)`;c.beginPath();c.moveTo(100,150);c.lineTo(190,142+i*7);c.lineTo(190,149+i*7);c.closePath();c.fill();});

  c.strokeStyle='rgba(255,228,170,.35)';c.lineWidth=2;c.beginPath();c.ellipse(95,151,52,13,0,Math.PI,0);c.stroke();
  // couches gagnées (mondes terminés) : éclats en orbite
  const bob=Math.sin(t*1.8)*4,ev=1+Math.sin(fx.evolveT*Math.PI)*0.3,R0=44*ev;
  for(let k=0;k<Math.min(2+L*2,10)*(L>0?1:0);k++){const a=t*(0.7+k*0.05)+k*2*Math.PI/Math.min(2+L*2,10);c.save();c.translate(95+Math.cos(a)*62,86+bob+Math.sin(a)*18);gemBody(c,6,4,(h+k*40)%360,80,55,t,k);c.restore();}

function cellAt(e){const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>=r.width||y>=r.height)return null;return {i:Math.floor(y/cell)*R.N+Math.floor(x/cell),x,y};}
cv.addEventListener('pointerdown',e=>{
  audio();Music.start();if(!R||R.paused)return;const h=cellAt(e);if(!h)return;
  const C=R.cells[h.i];if(!C||C.k==='lock')return;
  cv.setPointerCapture(e.pointerId);drag={from:h.i,x:h.x,y:h.y,sx:h.x,sy:h.y,moved:false};
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>6)drag.moved=true;});
function dropDrag(){
  if(!drag)return;const from=drag.from;
  if(drag.moved&&R.cells[from]){
    const snap=snapTarget(from,drag.x,drag.y);
    if(snap!=null){const res=runMove(from,snap,true);if(res==='merge'&&tutoStep===1)tutoNext();}
    else{const h=cellAt({clientX:drag.x+cv.getBoundingClientRect().left,clientY:drag.y+cv.getBoundingClientRect().top});
      if(h&&!R.cells[h.i]){runMove(from,h.i,true);fx.back={i:h.i,x:drag.x,y:drag.y-8,t:0};}
      else fx.back={i:from,x:drag.x,y:drag.y-8,t:0};}
  }
  drag=null;
}
cv.addEventListener('pointerup',dropDrag);
cv.addEventListener('pointercancel',dropDrag);

function loginHtml(){

  else if(el.dataset.pack){const r=buyPack(+el.dataset.pack);if(r===true){sfx.buy();save();refresh();if(R)renderTB();renderTab();}else if(r==='cap')toast(t('sh_cap',{h:CFG.sparkShop.capMin/60}));}

function countUp(el,from,to,ms=900){const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function flyShards(fromEl,toEl,n,onEach){
  if(!fromEl||!toEl||!motionOK()){if(onEach)for(let i=0;i<n;i++)onEach();return;}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,bx=b.left+b.width/2,by=b.top+b.height/2;
  for(let i=0;i<n;i++){const el=document.createElement('div');el.className='fly';el.innerHTML=ic('shard','is');document.body.appendChild(el);
    const sx=ax+rnd(-40,40),sy=ay+rnd(-30,30),cx=(sx+bx)/2+rnd(-80,80),cy2=Math.min(sy,by)-rnd(40,120),t0=performance.now()+i*45,D=520;
    const step=now=>{const k=Math.max(0,Math.min(1,(now-t0)/D));if(k<=0){requestAnimationFrame(step);return;}const u=1-k,x=u*u*sx+2*u*k*cx+k*k*bx,y=u*u*sy+2*u*k*cy2+k*k*by;el.style.transform=`translate(${x-12}px,${y-12}px) scale(${1.2-0.5*k})`;el.style.opacity=k>0.9?String((1-k)*10):'1';if(k<1)requestAnimationFrame(step);else{el.remove();if(onEach)onEach();}};
    requestAnimationFrame(step);}
}
