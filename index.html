<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prisme Fusion</title>

<style>
/* avoid-ai-design-ignore-file: C1, M4 */
/* Choix assumés : C1 (le violet est l'une des six couleurs du spectre : c'est le sujet du jeu, pas un dégradé par défaut) */
/* M4 (jeu mobile : les rebonds sont voulus, ils répondent aux actions du joueur) */
/* Nuit prismatique. Le jeu tourne en continu ;
   un seul écran : arène + plateau-écrin + boosters. La couleur vient du spectre des pièces ; l'interface reste en dalles indigo mates. */
:root{
  --night:#0d1530; --night-2:#142042; --slab:#1b2a55; --slab-hi:#24376b; --edge:#080d22; --line:#2f4380;
  --light:#fff6e4; --mist:#bfcbe8; --faint:#8391bb;
  --beam:#ffc857; --beam-hi:#ffe3a1; --beam-edge:#b8700f; --on-beam:#3b2000;
  --gem:#d48cff; --gem-edge:#6d2fa6; --shard:#7fe2ff; --shard-edge:#1f7c9c;
  --ok:#7df0b0; --danger:#ff5a6e;
  --s1:#ff5e7e; --s2:#ffb347; --s3:#ffe66d; --s4:#6cf0c2; --s5:#5ec8ff; --s6:#9d7bff;
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --wh:#5ec8ff;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--light);font:600 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(120% 55% at 50% -14%,rgba(255,214,150,.20),transparent 62%),
  linear-gradient(112deg,transparent 36%,rgba(255,94,126,.07) 41%,rgba(255,179,71,.07) 44%,rgba(255,230,109,.06) 47%,rgba(108,240,194,.06) 50%,rgba(94,200,255,.07) 53%,rgba(157,123,255,.07) 56%,transparent 61%)}
section{position:relative;z-index:1}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px}
.i{width:1.15em;height:1.15em;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ie{color:var(--beam)}.ig{color:var(--gem)}.is{color:var(--shard)}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px}

/* ---------- boutons en relief ---------- */
.b{--f:var(--slab-hi);--f2:var(--slab);--e:var(--edge);--t:var(--light);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:14px;margin-bottom:5px;
  background:linear-gradient(180deg,var(--f),var(--f2));color:var(--t);font:18px/1 var(--display);cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 5px 0 var(--e);transition:transform 70ms ease-out,box-shadow 70ms ease-out}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 var(--e)}
.b:disabled{filter:grayscale(.85) brightness(.72);cursor:default}
.b .i{color:inherit}
.b-gold{--f:#ffdf99;--f2:var(--beam);--e:var(--beam-edge);--t:var(--on-beam)}
.b-gem{--f:#e8bbff;--f2:#b865f0;--e:var(--gem-edge);--t:#2a0a45}
.b-shard{--f:#bff2ff;--f2:#58c9ec;--e:var(--shard-edge);--t:#06283a}
.b-red{--f:#ff9aa8;--f2:var(--danger);--e:#8f1d2e;--t:#3a0710}
.b.sm{font-size:16px;padding:0 12px;border-radius:12px}
.b small{font:800 12px var(--body);display:inline-flex;align-items:center;gap:2px;opacity:.85}

/* ---------- barre des monnaies ---------- */
.top{display:flex;gap:8px;justify-content:space-between;padding-block:10px 2px}
.pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:0;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--light);font:18px var(--display);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}
.pill .i{width:30px;height:30px}
.pill small{font:800 12px var(--body);color:var(--mist);white-space:nowrap}
.pill .plus{width:18px;height:18px;border-radius:50%;background:var(--gem);color:#2a0a45;display:grid;place-items:center}
.pill .plus .i{width:12px;height:12px}

.oc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge));box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--edge);transition:transform 70ms ease-out}
.oc .i{width:32px;height:32px}
@keyframes hot{to{box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--beam-edge),0 0 26px rgba(255,200,87,.9)}}
.badge{position:absolute;top:6px;right:calc(50% - 24px);width:13px;height:13px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 3px var(--night)}
.ptier{color:var(--mist);font-size:13px;margin-top:-4px;text-align:center}
/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,var(--night-2),var(--edge));box-shadow:0 -2px 0 var(--line)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:0;color:var(--mist);font:800 12px var(--body);cursor:pointer}
.nav button .i{width:27px;height:27px;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.nav button[aria-selected="true"]{color:var(--light)}
.nav button[aria-selected="true"] .i{color:var(--beam);transform:translateY(-3px) scale(1.14)}

/* ---------- onglets ---------- */
.phead{padding:10px 2px 6px}
.ttl{font:32px/1 var(--display);margin:0}
.sub{margin:4px 0 0;color:var(--mist);font-size:14px}
h2.sec{font:21px var(--display);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font:800 13px var(--body);color:var(--mist)}
.note{color:var(--mist);font-size:13px;margin:8px 2px}
.slab{background:linear-gradient(180deg,var(--slab-hi),var(--slab));border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge)}
.list{display:flex;flex-direction:column;gap:10px}
/* atelier */
.slot{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.slot.empty{display:flex;min-height:60px;gap:10px;padding:0 14px;border-radius:16px;border:2px dashed var(--line);color:var(--mist);font-weight:800;font-size:14px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--night-2) 60%,transparent 62%),conic-gradient(var(--beam) var(--p,0%),var(--edge) 0)}
.ring .i{width:26px;height:26px}
.slot b{display:block;font:17px/1.1 var(--display)}
.slot .tm{display:inline-flex;align-items:center;gap:4px;color:var(--beam);font-weight:800;font-size:14px}
.slot-acts{display:flex;flex-direction:column;gap:2px}
.slotbuy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mist);font-size:13px}
.grp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.grp button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--mist);font:800 12px var(--body);cursor:pointer;padding:0 2px}
.grp button .i{width:24px;height:24px}
.grp button[aria-pressed="true"]{background:linear-gradient(180deg,var(--slab-hi),var(--slab));color:var(--light);box-shadow:inset 0 0 0 2px var(--beam)}
.grp .badge{top:4px;right:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:0}
.tile[data-g="atk"]{--gc:var(--s1)}.tile[data-g="grid"]{--gc:var(--s5)}.tile[data-g="def"]{--gc:var(--s4)}.tile[data-g="eco"]{--gc:var(--s2)}.tile[data-g="jok"]{--gc:var(--s6)}
.tile-top{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:8px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.tico{grid-row:1/3;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 70%,#fff),color-mix(in srgb,var(--gc) 75%,#000));color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tico .i{width:26px;height:26px}
.tname{font:16px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis}
.tlvl{font-size:12.5px;color:var(--mist);font-weight:800}
.pips{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.pips i{display:block;height:100%;background:var(--gc,var(--beam))}
.tile .b{width:100%;justify-content:space-between;padding:0 10px}
.tstate{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--edge);color:var(--mist);font-weight:800;font-size:13px;margin-bottom:5px}
.tstate.run{color:var(--beam)}
.tile.locked .tico{filter:grayscale(1);opacity:.55}
.tile.locked .tname{color:var(--mist)}
.jcard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px}
.jcard.on{box-shadow:inset 0 0 0 2px var(--gem),0 4px 0 var(--edge)}
.jart{width:58px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);background:linear-gradient(160deg,#f3d3ff,#8e45d0);color:#2a0a45}
.jart .i{width:30px;height:30px}
.jcard.locked .jart{background:linear-gradient(160deg,#34498a,#18264f);color:var(--faint)}
.jcard b{font:19px var(--display)}
.jl{font-size:12.5px;color:var(--gem);font-weight:800;margin-left:6px}
.jcard p{margin:4px 0 0;color:var(--mist);font-size:13.5px}
.jcard .jmeta{color:var(--light);font-weight:800;font-size:13px}
.jbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.jbtns .d{color:var(--beam);font-weight:800;font-size:13px;display:inline-flex;gap:4px;align-items:center}
/* quêtes */
.quest{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px}
.quest.hl{box-shadow:inset 0 0 0 2px var(--beam),0 4px 0 var(--edge)}
.quest.done{opacity:.55}
.qic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--edge);color:var(--mist)}
.qic .i{width:22px;height:22px}
.quest.hl .qic{background:var(--beam);color:var(--on-beam)}
.quest.hl .qbar span{color:var(--on-beam);text-shadow:none}
.qbody b{display:block;font-weight:800;font-size:15px;line-height:1.25}
.qbar{position:relative;height:18px;border-radius:9px;background:var(--edge);overflow:hidden;margin:6px 0}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,var(--beam-hi),var(--beam));border-radius:9px}
.qbar span{position:relative;display:block;text-align:center;font:800 12px/18px var(--body);text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.rew{display:inline-flex;gap:6px;flex-wrap:wrap}
.rew span{display:inline-flex;align-items:center;gap:3px;background:var(--edge);border-radius:999px;padding:3px 9px 3px 5px;font-weight:800;font-size:13px}
.chap{height:12px;border-radius:6px;background:var(--edge);overflow:hidden;margin:0 2px 12px}
.chap i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
/* ligue */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:10px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod canvas{width:40px;height:40px}
.pod .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:30px var(--display);color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.pod.p1 .blk{height:88px;background:linear-gradient(180deg,var(--beam-hi),var(--beam))}
.pod.p2 .blk{height:68px;background:linear-gradient(180deg,#eef0ff,#b9bde8)}
.pod.p3 .blk{height:54px;background:linear-gradient(180deg,#ffd0a8,#e08b52)}
.lg{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto 44px;gap:8px;align-items:center;min-height:48px;padding:0 4px 0 10px;border-radius:12px;background:var(--night-2)}
.lg.me{background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 0 0 2px var(--beam)}
.lg .rk{font:17px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg.up .rk{color:var(--ok)}.lg.down .rk{color:var(--danger)}
.lg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.lg .sc{font:16px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg canvas{width:26px;height:26px}
.zone{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:6px 4px}
.zone.upz{color:var(--ok)}.zone.downz{color:var(--danger)}
.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35;border-radius:1px}
.rep{width:44px;height:44px;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;border-radius:12px}
.rep:disabled{color:var(--ok)}
/* boutique */
.offer{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.oart{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle at 40% 30%,var(--slab-hi),var(--edge))}
.oart .i{width:40px;height:40px}
.offer b,.gitem b{font:18px/1.1 var(--display)}
.offer p{margin:3px 0 0;color:var(--mist);font-size:13px}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 10px 8px;min-width:0}
.gitem .oart{width:56px;height:56px}
.gitem p{margin:0;color:var(--mist);font-size:12.5px;min-height:3em}
.gitem .b{width:100%}
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font:800 12.5px var(--body);min-height:44px}
.skin[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--beam)}
.skin canvas{width:40px;height:40px}
.skin span{color:var(--mist)}
.demo{color:var(--mist);font-size:13px;display:flex;gap:6px;align-items:center}
/* profil */
.field{display:flex;gap:8px;align-items:flex-start}
.field input{flex:1;min-width:0;min-height:46px;background:var(--edge);border:2px solid var(--line);border-radius:14px;padding:0 12px;color:var(--light);font:700 16px var(--body)}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:4px 2px 0;font-weight:800}
.switch{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 14px;font-weight:800;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.switch input:checked{background:var(--ok);box-shadow:none}
.switch input:checked::after{transform:translateX(22px);background:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px}
.stat b{display:block;font:22px var(--display)}
.stat span{color:var(--mist);font-size:12.5px;font-weight:800}
.best{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;background:var(--night-2);font-weight:800}
.best .i{color:var(--beam)}
.best span:last-child{color:var(--mist);font-size:13px}

/* ---------- modales ---------- */
.veil{position:fixed;inset:0;background:rgba(6,10,28,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:100%;max-width:380px;border-radius:26px;padding:22px 20px 16px;background:linear-gradient(180deg,#2a3f7a,var(--slab));box-shadow:inset 0 2px 0 rgba(255,255,255,.16),0 6px 0 var(--edge);text-align:center;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;animation:mpop 280ms cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{from{transform:scale(.86);opacity:0}}
.modal h2{font:29px/1.05 var(--display);margin:0}
.modal p{margin:0;color:var(--mist)}
.modal .big{font:44px/1 var(--display);color:var(--shard);font-variant-numeric:tabular-nums}
.modal .loot{display:inline-flex;align-items:center;gap:6px;font:24px var(--display);color:var(--shard);justify-content:center}
.modal .loot .i{width:30px;height:30px}
.mart{display:grid;place-items:center}
.mart .i{width:66px;height:66px}
.acts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.acts .b{width:100%}
.acts .row{display:flex;gap:8px}.acts .row .b{flex:1}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px}
.stars span .i{width:54px;height:54px;color:var(--edge)}
.stars span:nth-child(2) .i{width:66px;height:66px}
.stars .on .i{color:var(--beam);animation:starpop 460ms cubic-bezier(.34,1.56,.64,1) both}
.stars .on:nth-child(2) .i{animation-delay:.16s}.stars .on:nth-child(3) .i{animation-delay:.32s}
@keyframes starpop{from{transform:scale(0) rotate(-45deg)}}
.ad{font:68px/1 var(--display);color:var(--beam)}
.login{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ltile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--edge);font-size:12.5px;font-weight:800;min-height:56px;justify-content:center}.ltile small{color:var(--mist);font-size:11.5px}.ltile span{display:inline-flex;align-items:center;gap:3px}.ltile.past{opacity:.45}.ltile.today{box-shadow:inset 0 0 0 2px var(--beam);background:var(--slab-hi)}.ltile:last-child{grid-column:span 1}
.fly{position:fixed;left:0;top:0;width:24px;height:24px;z-index:30;pointer-events:none;filter:drop-shadow(0 0 6px rgba(127,226,255,.9))}.fly .i{width:24px;height:24px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--light);color:var(--night);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
/* ---------- écran unique : jeu ---------- */
body{margin:0}
#game{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--navh,calc(60px + var(--sab)))}
.gwrap{max-width:480px;width:100%;margin:0 auto;padding:8px 16px 8px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.arena{position:relative;flex:none;display:flex;flex-direction:column;gap:4px}
#bossCv{width:100%;height:clamp(96px,19vh,200px);display:block}
.stg{position:absolute;left:0;top:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;padding:2px 0 2px 4px}
.quick{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.qb{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;color:var(--mist)}
.qb span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(13,21,48,.75);box-shadow:inset 0 0 0 2px var(--line);transition:transform 70ms ease-out}
.qb span .i{width:18px;height:18px}
.qb:active:not(:disabled) span{transform:scale(.92)}
.qb:disabled{opacity:.35;cursor:default}
.qb.on{color:var(--beam)}.qb.on span{box-shadow:inset 0 0 0 2px var(--beam)}
.qb i{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--beam);box-shadow:0 0 0 2px var(--night)}
.qb.hot{color:var(--danger)}.qb.hot span{box-shadow:inset 0 0 0 2px var(--danger);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.stg b{font:19px/1 var(--display)}
.stg small{display:block;font:800 12.5px var(--body);color:var(--mist);margin-top:2px}
.stg .tmr{font:22px/1 var(--display);color:var(--beam);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.stg .tmr.late{color:var(--danger)}
.stg .tmr .i{width:20px;height:20px}
.hp{position:relative;height:10px;border-radius:5px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0}
#hpLag{background:#fff;opacity:.6}
#hpBar{background:linear-gradient(180deg,#ff9aa8,var(--danger));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.hp.titan #hpBar{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
.hp.shield{box-shadow:inset 0 0 0 2px var(--shard)}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:26px/1.1 var(--display);color:#fff;text-align:center;pointer-events:none;background:var(--slab-hi);border-radius:16px;padding:10px 18px;box-shadow:0 5px 0 var(--edge);animation:tin 260ms cubic-bezier(.34,1.56,.64,1);max-width:90%}
.banner small{display:block;font:800 13px var(--body);color:var(--mist);margin-top:3px}
.banner.boss{background:var(--danger);box-shadow:0 5px 0 #8f1d2e}.banner.boss small{color:#ffd6dc}
.banner.gold{background:var(--beam);color:var(--on-beam);box-shadow:0 5px 0 var(--beam-edge)}.banner.gold small{color:#5b3a00}
.boardwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--wh) 16%,transparent),transparent 70%)}
#board{display:block;touch-action:none;border-radius:20px}
.hint{background:var(--light);color:var(--night);border-radius:14px;padding:9px 12px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
/* jokers */
.jok{display:flex;gap:8px;justify-content:center}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--light);cursor:pointer;width:60px;padding:0;font:800 12px var(--body)}
.tool .oc{width:48px;height:48px}
.tool .oc .i{width:24px;height:24px}
.tool:active .oc{transform:translateY(3px) scale(.96)}
.tool small{font:800 12px var(--body);color:var(--mist)}
.jtool .oc{border:4px solid transparent;box-shadow:0 4px 0 var(--edge);background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge)) padding-box,conic-gradient(var(--gem) var(--p,0%),var(--line) 0) border-box;color:var(--gem)}
.jtool.ready .oc{background:radial-gradient(circle at 35% 30%,#f3d3ff,#8e45d0) padding-box,conic-gradient(var(--gem) 100%,var(--gem) 0) border-box;color:#2a0a45;animation:jready 650ms ease-in-out infinite alternate}
.jtool.ready small{color:var(--gem)}
@keyframes jready{to{transform:scale(1.08)}}
/* boosters temporaires */
.sparks{display:flex;justify-content:center;align-items:baseline;gap:10px;padding:0 2px}
.sparks b{display:inline-flex;align-items:center;gap:5px;font:22px/1 var(--display);color:var(--beam);font-variant-numeric:tabular-nums}
.sparks b .i{width:24px;height:24px}
.sparks small{font:800 12.5px var(--body);color:var(--mist)}
.tb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tbt{--tc:var(--beam);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:8px 2px 6px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge);color:var(--light);cursor:pointer;font:800 12px var(--body);transition:transform 70ms ease-out,box-shadow 70ms ease-out;min-width:0}
.tbt .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 70%,#fff),color-mix(in srgb,var(--tc) 70%,#000));color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tbt .ico .i{width:20px;height:20px}
.tbt .lv{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--edge);color:var(--mist);font:12px/18px var(--display)}
.tbt .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:12px}
.tbt b{display:inline-flex;align-items:center;gap:2px;font:14px/1 var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.tbt b .i{width:12px;height:12px}
.tbt:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 var(--edge)}
.tbt.ok{background:linear-gradient(180deg,#ffdf99,var(--beam));color:var(--on-beam);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--beam-edge)}
.tbt.ok b{color:var(--on-beam)}.tbt.ok .lv{background:rgba(59,32,0,.25);color:var(--on-beam)}
.tbt.ok:active:not(:disabled){box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 1px 0 var(--beam-edge)}
.tbt:disabled{cursor:default;opacity:.5}
.tbt.hot{animation:hot 1.2s ease-in-out infinite alternate}
.tbt.shake{animation:shake 300ms ease-in-out}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* actions */
@media (max-height:740px){
  .top{padding-block:6px 0}#bossCv{height:clamp(80px,15vh,140px)}.tbt{min-height:70px;padding-top:6px}.tbt .ico{width:28px;height:28px}.tbt .ico .i{width:16px;height:16px}
  .nav button{min-height:52px}
}
/* ---------- panneaux (atelier, quêtes, ligue, boutique, profil) ---------- */
#panel{position:fixed;inset:0;z-index:4;background:var(--night);overflow:auto;padding-top:var(--sat);padding-bottom:calc(6px + var(--navh,calc(56px + var(--sab))))}
#panel::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% -14%,rgba(255,214,150,.20),transparent 62%)}
#panel .wrap{position:relative}
.phead{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;padding:12px 2px 6px}
.phead .quit{grid-column:2;grid-row:1;width:44px;height:44px;border-radius:14px;border:0;display:grid;place-items:center;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--mist);cursor:pointer}
.phead .quit .i{width:22px;height:22px}
.stage{display:flex;flex-direction:column;align-items:center}
#me{width:150px;height:150px;display:block}
.tile[data-g="start"]{--gc:var(--s3)}.tile[data-g="auto"]{--gc:var(--s4)}.tile[data-g="arm"]{--gc:var(--s1)}
.grp{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}.grp::-webkit-scrollbar{display:none}
.grp button{flex:0 0 72px;font-size:12px;min-height:58px;padding:0}
.wpn{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--night-2)}
.wpn canvas{width:44px;height:44px}
.wpn b{font:16px var(--display)}.wpn b span{color:var(--beam);font-size:14px}.wpn b em{font:800 12px var(--body);color:var(--gem);margin-left:6px;font-style:normal}.wpn .b{margin:0;padding:0 10px}
.wpn p{margin:1px 0 0;color:var(--mist);font-size:13px}
.grp button .i{width:22px;height:22px}
.quest{cursor:pointer}
.quest .b{pointer-events:none}
.q-tap{grid-column:3}

#offline{z-index:40}

/* bulle cadeau : apparaît sous les pastilles, à droite */
.gift{position:absolute;right:16px;top:calc(50% - 160px);width:56px;height:56px;border-radius:50%;border:0;padding:0;z-index:3;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffe3a1,var(--beam));box-shadow:0 4px 0 var(--beam-edge),0 0 22px rgba(255,200,87,.6);color:var(--on-beam);animation:giftbob 1.4s ease-in-out infinite alternate}
.gift .i{width:28px;height:28px}
.gift.pop{animation:giftpop 500ms cubic-bezier(.34,1.56,.64,1),giftbob 1.4s 500ms ease-in-out infinite alternate}
@keyframes giftpop{from{transform:scale(0) rotate(-30deg)}}
@keyframes giftbob{to{transform:translateY(-6px)}}
.gwrap{position:relative}
.pips.inf{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6));opacity:.55}

.nav{padding-bottom:var(--sab)}
.veil{padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab))}
#toast{top:calc(64px + var(--sat))}
.b-spark{--f:#fff3b0;--f2:#ffc857;--e:var(--beam-edge);--t:#3a2a06}

.bump{animation:bump 260ms cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.12)}}
@media (max-height:700px){.hint{margin-right:54px}}
/* v11.2 : revue design */

.tname{font-size:15px}
.offer{position:relative}.offer.best{box-shadow:inset 0 0 0 2px var(--gem)}
.ribbon{position:absolute;top:-9px;right:14px;background:var(--gem);color:#22093a;font:13px/1 var(--display);padding:5px 9px;border-radius:9px;box-shadow:0 2px 0 var(--gem-edge)}
.bon{display:inline-block;font:13px/1 var(--display);padding:3px 6px;border-radius:7px;background:rgba(212,140,255,.18);color:var(--gem);vertical-align:2px}
.oart.pk{position:relative}.oart.pk .i{position:absolute;width:28px;height:28px}

.x2bar{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;padding:9px 12px;border-radius:12px;background:rgba(255,200,87,.12);box-shadow:inset 0 0 0 2px rgba(255,200,87,.45);color:var(--beam);font:15px var(--display)}.x2bar .i{width:18px;height:18px}
.lgsub{display:flex;align-items:flex-start;gap:10px}.lgsub .note{flex:1;margin-top:0}
.qhelp{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--light);font:20px var(--display);cursor:pointer}
.lg.bot .nm{font-style:normal;opacity:1}
.simtag{display:inline-block;margin-right:6px;font:700 11px/1 var(--body);padding:3px 6px;border-radius:6px;background:var(--night-2);color:var(--faint);vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.langbtn{width:100%;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}.langbtn .lv2{display:flex;align-items:center;gap:6px;color:var(--beam);font:16px var(--display)}.langbtn .lv2 .i{width:14px;height:14px;transform:rotate(45deg);opacity:.0}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.simall{margin:6px 0 8px;padding:8px 12px;border-radius:10px;background:var(--night-2);color:var(--mist);font-size:13px}
/* v11.3 : une bande du spectre par onglet, facettes au lieu de carrés arrondis, un seul élément taillé par écran */
#panel{--acc:var(--beam)}
#panel[data-acc=atelier]{--acc:var(--beam)}#panel[data-acc=quests]{--acc:var(--ok)}#panel[data-acc=clan]{--acc:var(--shard)}#panel[data-acc=shop],#panel[data-acc=pass]{--acc:var(--gem)}#panel[data-acc=profile]{--acc:var(--mist)}

.ntest{width:100%;margin-top:2px}

#panel h2.sec.subsec{font-size:17px;margin-top:18px}
.jnext{color:var(--beam);font-weight:800;white-space:nowrap}

.bprow{--tc:var(--beam);display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--night-2)}

.bprow b{font:15px var(--display)}.bprow b em{font:800 11.5px var(--body);font-style:normal;color:var(--mist);margin-left:4px}
.bprow p{margin:1px 0 0;font-size:12.5px;color:var(--mist)}
.bprow .b{margin:0;padding:0 10px;white-space:nowrap}.bprow .d{font:800 12px var(--body);color:var(--mist);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.bprow .d .i{width:12px;height:12px}
.bprow.lk{opacity:.6}
.atgrp button{flex:1 1 0;min-width:64px}
.ppbal{margin-top:4px}
.tbt.more .ico{background:rgba(255,255,255,.1);color:#fff}.tbt.more .ico .i{width:18px;height:18px}.tbt.more.ok .ico{background:var(--beam);color:var(--on-beam,#3a2a06)}
/* v12.3 — revue ergonomie / psychologie du joueur */
.badge.soft{width:9px;height:9px;background:var(--mist);opacity:.75;box-shadow:0 0 0 2px var(--night)}
.tbt .bdot{background:var(--mist);opacity:.8}
.tbt.newtab .ico{animation:tabpop 800ms cubic-bezier(.34,1.56,.64,1) 3}
.ribbon.rpop{background:var(--beam);color:var(--on-beam,#3a2a06)}
.offer.pop{box-shadow:inset 0 0 0 2px var(--beam),0 4px 0 var(--edge)}
.chbar{position:relative;height:10px;margin:6px 0 2px;border-radius:999px;background:var(--night);overflow:visible}
.chbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gem),#ff8ce0)}
.chbar b{position:absolute;top:-3px;width:2px;height:16px;background:var(--beam);border-radius:2px}
.chn{font:800 12px var(--body)!important;color:var(--mist)}.chn .i{width:12px;height:12px;vertical-align:-2px}
.offer.chok .b{animation:beat 1.1s ease-in-out infinite}

.ttl .qhelp.hh,.sub .qhelp.hh{display:inline-grid;width:26px;height:26px;min-height:0;font-size:15px;vertical-align:4px;margin-left:6px}
.sub .qhelp.hh{vertical-align:0;width:24px;height:24px;font-size:14px}
.ppn{display:inline-flex;align-items:center;gap:6px;font:18px var(--display)}.ppn .i{width:18px;height:18px;color:var(--shard)}.ppn b{font:inherit}
.demo{display:inline-flex;align-items:center;gap:5px;margin:-6px 0 10px;padding:3px 9px;border-radius:999px;background:var(--night-2);font:800 11.5px var(--body);color:var(--mist)}.demo .i{width:12px;height:12px}
.pnow{display:flex;align-items:center;gap:4px;font:800 13px var(--body);color:var(--mist)}.pnow .i{width:13px;height:13px}
.pchips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.pchips>.i{width:20px;height:20px}
.pchips span{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:var(--night-2);font:800 13px var(--body)}.pchips span .i{width:14px;height:14px}.pchips .sdot{margin:0 2px 0 0}
.bnc{display:inline-flex;align-items:center;gap:2px;margin:1px 3px 1px 0;font:800 11px var(--body);color:var(--beam);white-space:nowrap}.bnc .i{width:12px;height:12px}
.skin .skbn{display:flex;flex-wrap:wrap;justify-content:center}
.mdtot{display:flex;flex-wrap:wrap;gap:4px 8px}.mdtot .bnc{font-size:13px}.mdtot .bnc .i{width:15px;height:15px}
.medal .mrk .bnc,.medal .mnx .bnc{font-size:11.5px}
.hlp{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:10px;text-align:left}.hlp li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;font:700 14px/1.3 var(--body);color:var(--light,#e8ecff)}.hlp li .i{width:20px;height:20px;color:var(--beam)}
.prg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 12px}.prg span{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--night-2);font:16px var(--display)}.prg .i{width:18px;height:18px}
.prek p{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.prek p .i{width:20px;height:20px}
.lgday{display:inline-flex;align-items:center;gap:5px;margin:0;font:800 13px var(--body);color:var(--mist)}.lgday .i{width:15px;height:15px;color:var(--s1)}
.wpn .wbtn{min-width:56px;flex-direction:row;gap:4px}.wpn .wbtn .i{width:14px;height:14px}
.jmeta{display:flex;align-items:center;gap:3px}.jmeta .i{width:13px;height:13px;color:var(--beam)}
.stats.st2{grid-template-columns:repeat(4,minmax(0,1fr))}.stats.st2 .stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}.stats.st2 .stat .i{width:20px;height:20px;color:var(--mist)}.stats.st2 .stat b{font:17px var(--display)}
.plvl b{font:18px var(--display);color:var(--text,#fff)}.plvl .i{width:13px;height:13px;vertical-align:-2px}

.badge.rd{position:relative;display:inline-block;top:-7px;right:auto;width:10px;height:10px;margin-left:5px;vertical-align:middle;box-shadow:0 0 0 2px var(--night)}
.ppager .b{position:relative}.ppager .badge.rd{position:absolute;top:2px;right:2px;margin:0}

let LANG='fr';

function pickLang(){try{const s=localStorage.getItem('prisme-lang');if(s&&I18N[s])return s;}catch(e){}const nav=(navigator.languages||[navigator.language||'fr']).map(x=>x.slice(0,2).toLowerCase());for(const l of nav)if(I18N[l])return l;return 'en';}
function setLang(l){if(!I18N[l])return;LANG=l;try{localStorage.setItem('prisme-lang',l);}catch(e){}document.documentElement.lang=l;}
/* t('clé',{n:3}) : remplace {n} ; {n|s} ajoute « s » si n>1 (ou la chaîne donnée) */
function t(k,v){let s=I18N[LANG][k];if(s==null)s=I18N.fr[k];if(s==null)return k;if(!v)return s;return s.replace(/\{(\w+)(?:\|([^}]*))?\}/g,(m,key,pl)=>{const val=v[key];if(pl!==undefined){const many=+String(val).replace(/[^\d.]/g,'')>1;if(pl.includes('/')){const [a,b]=pl.split('/');return many?b:a;}return many?pl:'';}return val==null?'':String(val);});}
/* nombres : séparateurs de la langue, décimales locales */
const dec=(v,d=1)=>{try{return new Intl.NumberFormat(LANG,{minimumFractionDigits:0,maximumFractionDigits:d}).format(+v.toFixed(d));}catch(e){return v.toFixed(d);}};
const grp=n=>{try{return new Intl.NumberFormat(LANG).format(n);}catch(e){return String(n);}};

ur transfer code (Profile). You can also complain to your data protection authority.\nVersion 0, October 2026.", "sg_title": "Daily gift", "sg_p": "{n} free gems, every day.", "sg_done": "Tomorrow", "sg_got": "+{n} gems", "ps_title": "Season pass", "ps_left": "{d} day{d|s} left", "ps_lvl": "Tier {n} / {m} · {x} / {y} points", "ps_how": "Points: daily login and quests", "ps_buy": "Premium track: {p}", "ps_free": "Free", "ps_prem": "Premium", "ps_tier": "Tier {n}", "ps_note": "The same pass returns every 4-week season. If you already own the Season color, the last tier gives {g} gems instead.", "ps_got": "Reward claimed", "ps_skin": "Color from the last tier of the season pass", "skin_saison": "Season", "age_title": "Your date of birth", "age_p": "Enter your birth month and year.", "age_m": "Month", "age_y": "Year", "age_need": "Pick a month and a year.", "age_why": "Only your age group (adult or not) is kept, not your date. It cannot be changed afterwards.", "v_ok": "Confirm", "pay_minor": "Purchases unavailable", "pay_minor_p": "Real-money purchases are for adults only. The rest of the game stays fully available.", "sp_title": "Spending alert", "sp_p": "You have already spent {e} this month. This {p} purchase goes over your {c} limit.", "sp_go": "Buy anyway", "sp_sub": "Set the limit in Profile.", "cx_boss": "This boss is tough", "cx_boss_p": "Three failed attempts today. An Attack research in the Workshop often helps. A {h} h ×2 boost costs {g} gems in the shop.", "cx_atelier": "Open the Workshop", "cx_shop": "Shop", "cx_slots": "All slots busy", "cx_slots_p": "All your research slots are in use. One more slot costs {g} gems, forever.", "n_full": "Your offline reserve is full: come back for your sparks.", "n_res": "Research complete: {t}.", "n_res2": "{n} researches complete: {t}.", "n_titan": "The Titan is here today: your tickets are waiting.", "n_league": "Last day of the league: your rank locks tonight.", "nt_title": "Get notified?", "nt_p": "A notification for ono i suoi controlli (incluso il controllo parentale).\nI tuoi diritti: accesso, rettifica, cancellazione, opposizione e portabilità. Scrivi all'editore, all'indirizzo postale indicato nella scheda del gioco sullo store, con il tuo codice di trasferimento (Profilo). Puoi anche rivolgerti al Garante per la protezione dei dati.\nVersione 0, ottobre 2026.", "sg_title": "Regalo del giorno", "sg_p": "{n} gemme gratis, ogni giorno.", "sg_done": "Domani", "sg_got": "+{n} gemme", "ps_title": "Pass stagionale", "ps_left": "ancora {d} giorn{d|o/i}", "ps_lvl": "Livello {n} / {m} · {x} / {y} punti", "ps_how": "Punti: accesso giornaliero e missioni", "ps_buy": "Pista premium: {p}", "ps_free": "Gratis", "ps_prem": "Premium", "ps_tier": "Livello {n}", "ps_note": "Lo stesso pass torna a ogni stagione di 4 settimane. Se hai già il colore Stagione, l'ultimo livello dà invece {g} gemme.", "ps_got": "Ricompensa ritirata", "ps_skin": "Colore dell'ultimo livello del pass stagionale", "skin_saison": "Stagione", "age_title": "La tua data di nascita", "age_p": "Indica il mese e l'anno di nascita.", "age_m": "Mese", "age_y": "Anno", "age_need": "Scegli un mese e un anno.", "age_why": "Viene conservata solo la fascia d'età (adulto o no), non la data. Non si può modificare in seguito.", "v_ok": "Conferma", "pay_minor": "Acquisti non disponibili", "pay_minor_p": "Gli acquisti con denaro reale sono riservati agli adulti. Il resto del gioco resta accessibile.", "sp_title": "Avviso di spesa", "sp_p": "Hai già speso {e} questo mese. Questo acquisto da {p} supera il tuo limite di {c}.", "sp_go": "Acquista comunque", "sp_sub": "Il limite si regola nel Profilo.", "cx_boss": "Questo boss resiste", "cx_boss_p": "Tre tentativi falliti oggi. Una ricerca di Attacco nel Laboratorio spesso aiuta. Un potenziamento ×2 di {h} h costa {g} gemme nel negozio.", "cx_atelier": "Vai al Laboratorio", "cx_shop": "Negozio", "cx_slots": "Slot occupati", "cx_slots_p": "Tutte le tue ricerche sono già in corso. Uno slot in function fmt(n){
  if(!isFinite(n))return '∞';
  n=Math.floor(n);
  if(n<10000)return grp(n);
  let e=Math.floor(Math.log10(n)/3);let v=n/Math.pow(10,e*3);
  if(v>=999.5){e++;v=n/Math.pow(10,e*3);}
  const suf=e<=4?U()[e-1]:String.fromCharCode(97+Math.floor((e-5)/26)%26)+String.fromCharCode(97+(e-5)%26);
  return (v<100?dec(v,1):dec(v,0))+'\u202f'+suf;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const dur=s=>{s=Math.max(0,Math.ceil(s));const U=(I18N[LANG]._dur||I18N.fr._dur);if(s<60)return s+' '+U[0];if(s<3600)return Math.ceil(s/60)+' '+U[1];if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+' '+U[2]+(m?' '+String(m).padStart(2,'0'):'');}const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d+' '+U[3]+(h?' '+h+' '+U[2]:'');};
const clock=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let TZOFF=null; // côté serveur : décalage du joueur en minutes (−getTimezoneOffset) ; null = heure locale de l'appareil
function dparts(t){if(TZOFF==null){const d=new Date(t);return [d.getFullYear(),d.getMonth(),d.getDate(),d.getDay()];}const d=new Date(t+TZOFF*60000);return [d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCDay()];}
function dayKey(t=Date.now()){const [y,m,d]=dparts(t);return y+'-'+(m+1)+'-'+d;}
function weekKey(t=Date.now()){const [y,m,d,wd]=dparts(t);const mon=new Date(Date.UTC(y,m,d-((wd+6)%7)));return mon.getUTCFullYear()+'-'+(mon.getUTCMonth()+1)+'-'+mon.getUTCDate();}
const dayOfWeek=(t=Date.now())=>dparts(t)[3];

const BAN_WORD=['con','conne','pd','fdp','ntm','tg','nazi','cul','fag','kkk','ss'];
function normName(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t');}
function checkName(raw){
  const s=raw.trim().replace(/\s+/g,' ');
  if(s.length<3)return {ok:false,msg:t('name_short')};
  if(s.length>16)return {ok:false,msg:t('name_long')};
  if(!/^[\p{L}\p{N} _-]+$/u.test(s))return {ok:false,msg:t('name_chars')};
  const n=normName(s),words=n.split(/[\s_-]+/).map(w=>w.replace(/[^a-z]/g,'')),flatRaw=n.replace(/[^a-z]/g,''),flat=flatRaw.replace(/(.)\1+/g,'$1');
  if(BAN_SUB.some(b=>flatRaw.includes(b)||flat.includes(b.replace(/(.)\1+/g,'$1')))||words.some(w=>BAN_WORD.includes(w))||BAN_WORD.includes(flatRaw))return {ok:false,msg:t('name_banned')};
  return {ok:true,name:s};
}

    mode:'farm',bossT:0,titanT:0,titanDmg:0,dmgWin:[],sparkWin:[],baseWin:[],killWin:[],buyT:0};

const emptyCells=()=>R.cells.map((c,i)=>c?-1:i).filter(i=>i>=0);
const shapes=()=>R.cells.map((c,i)=>[c,i]).filter(x=>x[0]&&x[0].l);
function bumpBoard(){const sl=spawnLevel();for(let i=0;i<R.cells.length;i++){const c=R.cells[i];if(c&&c.l&&c.l<sl){c.l=sl;hooks.spawn(i);}}}
function spawnOne(){
  let e=emptyCells();

    const n=1+S.up.sursis;const small=shapes().sort((a,b)=>a[0].l-b[0].l).slice(0,n);if(!small.length)return -1;small.forEach(([c,i])=>{R.cells[i]=null;hooks.bomb(i,[i]);});e=emptyCells();}
  const i=e[Math.floor(Math.random()*e.length)];
  const l=spawnLevel()+(Math.random()<0.03*S.up.lucky?1:0);R.cells[i]={l};if(Math.random()<0.01*S.up.gold)R.cells[i].k='gold';

const nb=i=>{const N=R.N,x=i%N,y=Math.floor(i/N),o=[];if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);return o;};
function bossAttack(){

function pushWin(arr,t,v,w=CFG.offline.rateWindow){arr.push([t,v]);while(arr.length&&arr[0][0]<t-w)arr.shift();}
function measureRates(){const w=CFG.offline.rateWindow;S.run.srate=R.sparkWin.reduce((a,x)=>a+x[1],0)/w;S.run.brate=R.baseWin.reduce((a,x)=>a+x[1],0)/CFG.rate.window;S.run.rate=R.dmgWin.reduce((a,x)=>a+x[1],0)/w;S.run.krate=R.killWin.length/w;}
function runTick(dt){

  for(let i=0;i<R.cells.length;i++){const c=R.cells[i];if(!c)continue;if(c.fog&&c.fog<=R.t)delete c.fog;if(c.k==='lock'&&c.until<=R.t){R.cells[i]=null;hooks.unlock(i);}}

}
function autoMerge(){const seen={};const o=shapes().filter(x=>!x[0].fog).sort((a,b)=>a[0].l-b[0].l);for(const [c,i] of o){if(seen[c.l]!=null){runMove(seen[c.l],i,false);return true;}seen[c.l]=i;}

function applyDamage(into,d,crit,w,silent){

function fireRate(){const c=R.comboT>0?1+(0.05+0.01*S.up.combo)*R.combo:1;return (1+0.05*S.up.cadence)*c*(R.t<R.surgeUntil?2:1);}
function fireOne(i,C){

  if(E.shieldL&&l<E.shieldL&&R.t>=R.breakUntil&&w.id!=='sq'){hooks.hit(i,0,true,false,w);return;}

  if(w.id==='dia'){}else{for(const j of nb(i)){const B=R.cells[j];if(B&&B.l&&weaponOf(B.l).id==='dia')d*=1+(0.25+0.1*S.up.aura)*effectPow(B.l);}}

function fireTick(dt){

  if(R.burn&&R.burn.until>R.t){applyDamage(null,R.burn.dps*dt,false,null,true);}

function doMerge(into,l,gold,manual){

  S.st.merges++;S.day.merges++;S.week.merges=(S.week.merges|0)+1;if(manual){S.st.manual++;R.combo=Math.min(R.combo+1,30);R.comboT=3;if(R.combo>S.st.maxCombo)S.st.maxCombo=R.combo;if(R.combo>(S.day.combo||0))S.day.combo=R.combo;}

  for(const j of nb(into))if(R.cells[j]&&R.cells[j].k==='lock'){R.cells[j]=null;hooks.unlock(j);}
  hooks.merge(into,l,gold,manual);

const jokerCap=()=>spawnLevel()+1+(S.jk.chameleon||1);
function runMove(a,b,manual=true){
  if(!R||a===b)return 'none';

/* cible aimantée : la gemme compatible la plus proche du point de dépôt (rayon 0,6 case) */
function snapTarget(from,x,y){

  for(let i=0;i<R.cells.length;i++){const B=R.cells[i];if(i===from||!B||B.k==='lock')continue;
    const okm=(A.l&&B.l===A.l&&!A.fog&&!B.fog)||(A.k==='joker'&&B.l&&B.l<=jokerCap())||(B.k==='joker'&&A.l&&A.l<=jokerCap());if(!okm)continue;
    const cx2=(i%R.N+.5)*cell,cy2=(Math.floor(i/R.N)+.5)*cell,d=Math.hypot(cx2-x,cy2-y);if(d<bd){bd=d;best=i;}}

function onKill(){

  S.run.stage=n+1;S.run.max=Math.max(S.run.max,S.run.stage);if(S.run.stage>S.maxStage)S.maxStage=S.run.stage;if(S.run.stage>S.bestStage){S.bestStage=S.run.stage;hooks.evolve();}

/* ================= compte : Google / Apple (Supabase Auth, jeton d'identité) =================
   Le compte sert à une chose : lier la partie de cet appareil et la retrouver ailleurs (nouveau téléphone, réinstallation).
   Le jeu reste jouable sans compte. Aucun mot de passe chez nous, aucun e-mail envoyé : Google / Apple garantissent l'adresse.
   Activation : renseigner OAUTH.google (identifiant client « Web » de Google Cloud) et activer Google dans Supabase Auth. */
const OAUTH={google:'',googleIos:''};
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem('prisme-auth')||'null');}catch(e){}
function authSave(a){AUTH=a;try{if(a)localStorage.setItem('prisme-auth',JSON.stringify(a));else localStorage.removeItem('prisme-auth');}catch(e){}}
async function authPost(path,body){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),10000);
  try{const r=await fetch(`${NET.url}/auth/v1/${path}`,{method:'POST',headers:{'apikey':NET.key,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(d.error_code||d.msg||'http'+r.status);e.code=d.error_code||d.error||(r.status===429?'over_request_rate_limit':'server');throw e;}
    return d;}
  finally{clearTimeout(to);}
}
const authKeep=d=>{if(d&&d.access_token){authSave({at:d.access_token,rt:d.refresh_token,exp:_dateNow()+(d.expires_in||3600)*1000,email:(d.user&&d.user.email)||(AUTH&&AUTH.email)||''});return true;}return false;};
const SLogin=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SocialLogin;
const capPlatform=()=>{try{return window.Capacitor&&window.Capacitor.getPlatform?window.Capacitor.getPlatform():'web';}catch(e){return 'web';}};
/* fournisseurs proposés sur cet appareil : Google sur Android/iOS (si configuré), Apple sur iOS (exigé par Apple dès qu'on propose Google) */
function authProviders(){const p=capPlatform(),o=[];if(!SLogin())return o;if(OAUTH.google&&(p==='android'||p==='ios'))o.push('google');if(p==='ios')o.push('apple');return o;}
const hexRand=n=>{const u=new Uint8Array(n);crypto.getRandomValues(u);return [...u].map(b=>b.toString(16).padStart(2,'0')).join('');};
async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
let slReady=false;
async function authWith(provider){
  const sl=SLogin();if(!sl||!authProviders().includes(provider)){const e=new Error('unavailable');e.code='unavailable';throw e;}
  if(!slReady){const cfg={};if(OAUTH.google)cfg.google={webClientId:OAUTH.google,iOSClientId:OAUTH.googleIos||undefined,iOSServerClientId:OAUTH.google};if(capPlatform()==='ios')cfg.apple={};await sl.initialize(cfg);slReady=true;}
  const raw=hexRand(16),hashed=await sha256hex(raw); // Google/Apple signent le hash ; Supabase vérifie avec la valeur brute
  let res;try{res=await sl.login({provider,options:provider==='google'?{scopes:['email','profile'],nonce:hashed}:{scopes:['email'],nonce:hashed}});}
  catch(x){const e=new Error('cancel');e.code='cancel';throw e;}
  const tok=res&&res.result&&res.result.idToken;if(!tok){const e=new Error('cancel');e.code='cancel';throw e;}
  const d=await authPost('token?grant_type=id_token',{provider,id_token:tok,nonce:raw});authKeep(d);return d;
}
async function authToken(){if(!AUTH)return null;if(_dateNow()<AUTH.exp-60e3)return AUTH.at;try{const d=await authPost('token?grant_type=refresh_token',{refresh_token:AUTH.rt});authKeep(d);return AUTH.at;}catch(e){if(e.code!=='server')authSave(null);return null;}}
const authLogout=()=>{authSave(null);try{const sl=SLogin();if(sl&&slReady)sl.logout({provider:'google'}).catch(()=>{});}catch(e){}};
const authEmail=()=>AUTH&&AUTH.email||'';
async function rpcAuth(fn,args){const tok=await authToken();if(!tok){const e=new Error('login');e.code='login';throw e;}
  const r=await fetch(`${NET.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'apikey':NET.key,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.message||'http'+r.status);e.code=d.message||'server';throw e;}return d;}

function idHue(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return h%360;}
/* code de transfert : identité appareil encodée (PF1-<base32 id+secret>) pour retrouver sa partie sur un autre appareil */
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function b32enc(bytes){let bits=0,v=0,o='';for(const b of bytes){v=(v<<8)|b;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5;}}if(bits>0)o+=B32[(v<<(5-bits))&31];return o;}
function b32dec(s){let bits=0,v=0;const o=[];for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;v=(v<<5)|i;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8;}}return o;}
const hex2b=h=>h.match(/.{2}/g).map(x=>parseInt(x,16));
function xferCode(){const raw=hex2b(DEV.id.replace(/-/g,'')).concat(hex2b(DEV.s));let sum=0;for(const b of raw)sum=(sum+b)&255;const s=b32enc(raw.concat([sum]));return 'PF1-'+s.match(/.{1,6}/g).join('-');}
function xferParse(txt){const s=String(txt||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^PF1/,'').replace(/O/g,'0').replace(/I/g,'1');const b=b32dec(s);if(!b||b.length<41)return null;const raw=b.slice(0,40),sum=b[40];let c=0;for(const x of raw)c=(c+x)&255;if(c!==sum)return null;const hx=a=>a.map(x=>x.toString(16).padStart(2,'0')).join('');const h=hx(raw.slice(0,16));return {id:`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`,s:hx(raw.slice(16,40))};}

/* ================= audio : musique générative + effets ================= */
let AC=null,musBus=null,sfxBus=null,delay=null;
function audio(){
  if(!S.settings.music&&!S.settings.sound)return null;
  if(document.hidden)return null; // v10.2 : jamais de son quand le jeu est en arrière-plan
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
      musBus=AC.createGain();musBus.gain.value=0.55;musBus.connect(comp);
      sfxBus=AC.createGain();sfxBus.gain.value=0.9;sfxBus.connect(comp);
      delay=AC.createDelay(1);delay.delayTime.value=0.375;const fb=AC.createGain();fb.gain.value=0.32;const wet=AC.createGain();wet.gain.value=0.35;
      delay.connect(fb).connect(delay);delay.connect(wet).connect(musBus);}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
  return AC;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // la m – fa – do – sol
const PENTA=[0,3,5,7,10];
const Music={on:false,step:0,next:0,timer:null,int:0.15,target:0.15,
  start(){const a=audio();if(!a||!S.settings.music||this.on)return;this.on=true;this.next=a.currentTime+0.1;this.step=0;this.timer=setInterval(()=>this.sched(),25);},
  stop(){this.on=false;clearInterval(this.timer);},
  key(){return R&&R.mode==='level'?worldInfo(R.w).k:0;},
  sched(){if(!AC)return;const spb=60/100/2;while(this.next<AC.currentTime+0.15){this.play(this.step,this.next);this.next+=spb;this.step++;}this.int+=(this.target-this.int)*0.05;},
  play(s,t){
    const k=this.key(),bar=Math.floor(s/8)%4,ch=PROG[bar].map(n=>n+k),i=this.int,pos=s%8;
    if(pos===0){ch.forEach((n,j)=>{pad(mtof(n),t,2.4,0.018);pad(mtof(n)*1.004,t,2.4,0.014);});}
    if(pos%4===0)pluck(mtof(ch[0]-24),t,0.5,'sine',0.13);
    const arpOn=i>0.45?true:pos%2===0;
    if(arpOn){const pat=[0,1,2,1,2,0,1,2];const n=ch[pat[pos]]+12+(i>0.7&&pos>=4?12:0);pluck(mtof(n),t,0.28,'triangle',0.045,true);}
    if(i>0.6&&pos%2===1)hat(t,0.012+0.01*(i-0.6));
    if(i>0.85&&pos===6)pluck(mtof(ch[2]+24),t,0.6,'sine',0.03,true);
  }
};
function pad(f,t,d,g){const o=AC.createOscillator(),v=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700+Music.int*900;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+0.5);v.gain.linearRampToValueAtTime(0,t+d);o.connect(lp).connect(v).connect(musBus);o.start(t);o.stop(t+d+0.05);}
function pluck(f,t,d,type,g,wet){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v);v.connect(musBus);if(wet)v.connect(delay);o.start(t);o.stop(t+d+0.05);}
let noiseBuf=null;
function hat(t,g){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.05,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),v=AC.createGain();s.buffer=noiseBuf;bp.type='highpass';bp.frequency.value=7000;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.connect(bp).connect(v).connect(musBus);s.start(t);}
function tone(f,d,type,g,delayS=0){const a=audio();if(!a||!S.settings.sound)return;const t=a.currentTime+delayS,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v).connect(sfxBus);o.start(t);o.stop(t+d+0.02);}
const sfx={
  merge(c){const k=Music.key(),deg=PENTA[(c-1)%5],oct=Math.floor((c-1)/5);const f=mtof(69+k+deg+12*Math.min(oct,2));tone(f,0.16,'triangle',0.13);tone(f*2,0.1,'sine',0.04);},
  click(){const k=Music.key();tone(mtof(81+k),0.045,'triangle',0.06);tone(mtof(93+k),0.06,'sine',0.03,0.02);},
  buy(){tone(660,0.08,'square',0.05);tone(990,0.1,'square',0.04,0.06);},
  chord(){[0,4,7,12].forEach((s,i)=>tone(mtof(69+Music.key()+s),0.35,'triangle',0.09,i*0.07));},
  win(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(mtof(69+Music.key()+s),0.4,'triangle',0.09,i*0.06));},
  low(){tone(80,0.7,'sawtooth',0.12);},
  boom(){tone(60,0.4,'square',0.1);tone(120,0.2,'sawtooth',0.06);},
  tick(){tone(mtof(81+Music.key()),0.06,'triangle',0.035);}, // v10.3 : plus de bip carré à 1200 Hz, note douce dans la tonalité
  pop(){const now=AC?AC.currentTime:0;if(now-(this._pop||-9)<1.6)return;this._pop=now;const k=Music.key(),deg=PENTA[Math.floor(Math.random()*5)];tone(mtof(64+k+deg),0.14,'sine',0.03);}, // v10.3 : ennemi vaincu, discret et au plus toutes les 1,6 s
};

/* ================= pièces en verre taillé (pièce de référence + famille) ================= */
const HUES=[196,262,328,18,46,148,178,228,292,352,84,166];
const hueOf=l=>HUES[(l-1)%HUES.length];
const SPEC=['255,94,126','255,179,71','255,230,109','108,240,194','94,200,255','157,123,255'];
function poly(c,x,y,r,sides,rot){c.beginPath();const n=sides||16;for(let k=0;k<n;k++){const a=rot+k*2*Math.PI/n-Math.PI/2,px=x+r*Math.cos(a),py=y+r*Math.sin(a);k?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
function vtx(r,n,rot){const p=[];for(let k=0;k<n;k++){const a=rot+k*2*Math.PI/n-Math.PI/2;p.push([r*Math.cos(a),r*Math.sin(a)]);}return p;}
function spark(c,x,y,s){
  c.save();c.translate(x,y);c.globalCompositeOperation='lighter';
  SPEC.slice(0,4).forEach((col,i)=>{const o=(i-1.5)*0.7;c.strokeStyle=`rgba(${col},.6)`;c.lineWidth=1.3;c.beginPath();c.moveTo(-s+o,o);c.lineTo(s+o,o);c.moveTo(o,-s+o);c.lineTo(o,s+o);c.stroke();});
  c.fillStyle='#fff';c.beginPath();c.arc(0,0,s*0.2,0,7);c.fill();c.restore();
}
/* Une gemme : couronne de facettes éclairées en haut à gauche, table claire, contour sombre, reflet, étincelle spectrale. */
function gemBody(c,r,n,h,sat,L0,t,seed,rot=0){
  const out=vtx(r,n,rot),inn=vtx(r*0.54,n,rot),LA=-2.35;
  for(let k=0;k<n;k++){const a=out[k],b=out[(k+1)%n],ia=inn[k],ib=inn[(k+1)%n];
    const mid=Math.atan2((a[1]+b[1])/2,(a[0]+b[0])/2),sh=0.5+0.5*Math.cos(mid-LA);
    c.fillStyle=`hsl(${h} ${sat}% ${L0-20+sh*36}%)`;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(ib[0],ib[1]);c.lineTo(ia[0],ia[1]);c.closePath();c.fill();}
  const g=c.createLinearGradient(-r*.5,-r*.5,r*.45,r*.5);g.addColorStop(0,`hsl(${h} ${sat}% ${Math.min(92,L0+30)}%)`);g.addColorStop(1,`hsl(${h} ${sat}% ${L0+2}%)`);

  c.beginPath();out.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.lineWidth=Math.max(1.6,r*0.07);c.strokeStyle=`hsl(${h} 70% 16%)`;c.stroke();

function drawGem(c,x,y,r,l,sx,sy,gold,t){

const TIERS_FX={small:{tr:0,stop:0,vib:0},medium:{tr:.2,stop:0,vib:10},large:{tr:.45,stop:70,vib:[20,30,30]},huge:{tr:.7,stop:140,vib:[30,40,30,40,120]}};
/* Anti-cumul : une secousse par palier au plus toutes les 700 ms, et le tremblement total est plafonné à 0,6 (les critiques en rafale ne font plus trembler l'écran en continu). */

  fx.sq[i]=0;fx.burst(i,gold?48:hueOf(l),(manual?10:5)+Math.min(l,12),manual?240:150);

  if(manual&&R.combo>1){const [x,y]=fx.at(i);fx.floats.push({x,y:y-cell*.35,t:0,txt:'×'+R.combo,h:48});}
  if(gold){const [x,y]=fx.at(i);fx.floats.push({x,y:y-cell*.1,t:0,txt:'+'+Math.max(1,Math.round(l*lootMult())),h:190});}

};

  for(let i=0;i<R.N*R.N;i++){const x=(i%R.N)*cell,y=Math.floor(i/R.N)*cell,p=Math.max(2,cell*0.045);
    c.fillStyle='#0b1330';c.beginPath();c.roundRect(x+p,y+p,cell-2*p,cell-2*p,cell*0.2);c.fill();
    c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=2;c.beginPath();c.moveTo(x+p+cell*.18,y+p+1);c.lineTo(x+cell-p-cell*.18,y+p+1);c.stroke();
    c.strokeStyle=`hsla(${wh},70%,75%,.10)`;c.beginPath();c.moveTo(x+p+cell*.18,y+cell-p-1);c.lineTo(x+cell-p-cell*.18,y+cell-p-1);c.stroke();}
}
function drawBoard(dt,now){

  fx.trauma=Math.max(0,fx.trauma-1.7*dt);
  c.save();c.translate(W/2+ox,W/2+oy);c.rotate(rot);c.translate(-W/2,-W/2);

  const r=cell*0.42;
  const auraCells=new Set();for(let i=0;i<R.cells.length;i++){const C=R.cells[i];if(C&&C.l&&weaponOf(C.l).id==='dia')for(const j of nb(i))if(R.cells[j]&&R.cells[j].l)auraCells.add(j);}

    if(fx.sq[i]!=null){fx.sq[i]+=dt;const a=fx.sq[i],e=Math.exp(-a*9)*Math.cos(a*26);sx*=1+0.3*e;sy*=1-0.26*e;if(a>0.6)delete fx.sq[i];}
    let [x,y]=fx.at(i);
    if(fx.back&&fx.back.i===i){fx.back.t+=dt;const k=Math.min(1,fx.back.t/0.18),e=1-Math.pow(1-k,3);x=fx.back.x+(x-fx.back.x)*e;y=fx.back.y+(y-fx.back.y)*e;if(k>=1)fx.back=null;}
    if(C.l&&auraCells.has(i)){c.save();c.globalAlpha=0.35+0.15*Math.sin(now*4);c.strokeStyle='rgb(212,140,255)';c.lineWidth=3;c.beginPath();c.arc(x,y,r*1.08,0,7);c.stroke();c.restore();}
    if(C.l&&C.fog)drawSpecial(c,x,y,r,'fog',now,sx);else if(C.l)drawGem(c,x,y,r,C.l,sx,sy,C.k==='gold',now);else drawSpecial(c,x,y,r,C.k,now,sx);
  }
  if(drag&&R.cells[drag.from]){const C=R.cells[drag.from];let dx=drag.x,dy=drag.y-8;if(snap!=null){const [tx,ty]=fx.at(snap);dx=dx+(tx-dx)*0.45;dy=dy+(ty-dy)*0.45;}if(C.l)drawGem(c,dx,dy,r,C.l,1.15,1.15,C.k==='gold',now);else drawSpecial(c,dx,dy,r,C.k,now,1.15);}
  c.globalCompositeOperation='lighter';
  fx.rings=fx.rings.filter(o=>{o.t+=dt;const k=o.t/0.42;if(k>=1)return false;c.beginPath();c.arc(o.x,o.y,r+k*cell*0.9,0,7);c.strokeStyle=`hsla(${o.h},100%,70%,${(1-k)*0.8})`;c.lineWidth=3*(1-k)+0.5;c.stroke();return true;});
  fx.parts=fx.parts.filter(p=>{p.t+=dt;if(p.t>=p.life)return false;p.vx*=0.92;p.vy*=0.92;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=1-p.t/p.life;c.fillStyle=p.col?`rgba(${p.col},${a})`:`hsla(${p.h},100%,68%,${a})`;c.beginPath();c.moveTo(p.x,p.y-p.sz*a*1.6);c.lineTo(p.x+p.sz*a*.6,p.y);c.lineTo(p.x,p.y+p.sz*a*1.6);c.lineTo(p.x-p.sz*a*.6,p.y);c.closePath();c.fill();return true;});
  fx.shots=fx.shots.filter(s=>{s.t+=dt;const k=Math.min(1,s.t/0.22),y=s.y-(s.y+30)*k*k;
    if(s.col){c.strokeStyle=s.blocked?'rgba(127,226,255,.5)':`rgba(${s.col},.85)`;c.lineWidth=3*(1-k*0.4);c.beginPath();c.moveTo(s.x,y);c.lineTo(s.x,Math.min(s.y,y+26));c.stroke();c.fillStyle=`rgba(${s.col},1)`;c.beginPath();c.arc(s.x,y,3.5,0,7);c.fill();}
    else{SPEC.forEach((col,j)=>{c.strokeStyle=`rgba(${col},.8)`;c.lineWidth=2.2*(1-k*0.4);c.beginPath();const o=(j-2.5)*1.6;c.moveTo(s.x+o,y);c.lineTo(s.x+o*0.4,Math.min(s.y,y+30));c.stroke();});c.fillStyle='#fff';c.beginPath();c.arc(s.x,y,4,0,7);c.fill();}if(k>=1){shotLanded(s);return false;}return true;});
  fx.beams=fx.beams.filter(b=>{b.t+=dt;if(b.t>0.5)return false;const [x,y]=fx.at(b.i),a=1-b.t/0.5;c.strokeStyle=`rgba(255,90,110,${a})`;c.lineWidth=5*a+1;c.beginPath();c.moveTo(W/2,-10);c.lineTo(x,y);c.stroke();c.fillStyle=`rgba(255,90,110,${a*0.35})`;c.beginPath();c.arc(x,y,cell*0.45,0,7);c.fill();return true;});
  if(fx.glow>0.02){const g=c.createLinearGradient(0,0,W,W);SPEC.forEach((col,j)=>g.addColorStop(j/5,`rgba(${col},${fx.glow*0.7})`));c.strokeStyle=g;c.lineWidth=2+fx.glow*5;c.beginPath();c.roundRect(1.5,1.5,W-3,W-3,19);c.stroke();fx.glow*=Math.pow(0.22,dt);}
  c.globalCompositeOperation='source-over';
  fx.floats=fx.floats.filter(f=>{f.t+=dt;if(f.t>0.9)return false;const a=1-f.t/0.9,s=easeBack(Math.min(1,f.t/0.2));c.save();c.translate(f.x,f.y-f.t*36);c.scale(s,s);c.font=(f.small?'15px':'24px')+' "Lilita One",system-ui,sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=f.small?3:5;c.strokeStyle=`rgba(13,21,48,${a})`;c.strokeText(f.txt,0,0);c.fillStyle=`hsla(${f.h},100%,72%,${a})`;c.fillText(f.txt,0,0);c.restore();return true;});
  if(fx.flash>0){c.fillStyle=`rgba(${fx.flashCol},${fx.flash*0.28})`;c.fillRect(-10,-10,W+20,W+20);fx.flash=Math.max(0,fx.flash-dt*1.5);}
  c.restore();
  if(tutoStep===1){const pair=findPair();if(pair){const [ax,ay]=fx.at(pair[0]),[bx,by]=fx.at(pair[1]);const k=(now*0.8)%1;c.save();c.setTransform(dpr,0,0,dpr,0,0);c.strokeStyle='#ffc857';c.lineWidth=4;c.setLineDash([10,9]);c.lineDashOffset=-now*30;c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.setLineDash([]);c.fillStyle='#fff6e4';c.beginPath();c.arc(ax+(bx-ax)*k,ay+(by-ay)*k,10,0,7);c.fill();c.restore();}}
}
function findPair(){const seen={};for(let i=0;i<R.cells.length;i++){const c=R.cells[i];if(c&&c.l){if(seen[c.l]!=null)return [seen[c.l],i];seen[c.l]=i;}}return null;}
function skinHue(t){const k=skinInfo(S.skin)||skinInfo('cyan');if(k.hue===-2)return 225+75*Math.sin(t*0.9);if(k.hue===-3)return 38+14*Math.sin(t*2.2);if(k.hue<0)return (t*50)%360;return k.x?(k.hue+25*Math.sin(t*2)+360)%360:k.hue;} // v12 : couleurs de saison (Éclat = reflets)

function enemyHue(){return R.E.type==='titan'?WORLDS[R.E.th].h:worldInfo(worldOf(R.E.stage)).h;}
function bodyShape(c,th,r,t,type){
  c.beginPath();
  if(th===0){poly(c,0,0,r,3,t*0.2);c.fill();c.stroke();const m=3+(type==='boss'?2:0);for(let k=0;k<m;k++){const a=t*0.9+k*2*Math.PI/m;c.beginPath();poly(c,Math.cos(a)*r*1.45,Math.sin(a)*r*1.1,r*0.22,3,-t);c.fill();c.stroke();}}
  else if(th===1){const n=10;for(let k=0;k<n*2;k++){const a=k*Math.PI/n-Math.PI/2,rr=k%2?r*(0.62+0.08*Math.sin(t*9+k)):r*(1+0.06*Math.sin(t*7+k));k?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fill();c.stroke();}
  else if(th===2){for(let k=0;k<6;k++){const x0=(k-2.5)*r*0.32;c.beginPath();c.moveTo(x0,r*0.5);c.bezierCurveTo(x0+Math.sin(t*2+k)*r*0.3,r*1.0,x0-Math.sin(t*2+k)*r*0.3,r*1.3,x0+Math.sin(t*3+k)*r*0.2,r*1.55);c.stroke();}c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();c.stroke();}
  else if(th===3){poly(c,0,0,r,6,0);c.fill();c.stroke();const n=8;for(let k=0;k<n;k++){const a=t*0.7+k*2*Math.PI/n;c.beginPath();c.arc(Math.cos(a)*r*1.4,Math.sin(a)*r*1.4,r*0.08,0,7);c.fill();c.stroke();}}
  else{c.save();c.rotate(t*0.4);poly(c,0,0,r,6,0);c.fill();c.stroke();c.rotate(-t*0.8);c.beginPath();for(let k=0;k<12;k++){const a=k*Math.PI/6,rr=k%2?r*0.55:r*1.05;k?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fill();c.stroke();c.restore();}
  if(type==='mini'){for(const sgn of [-1,1]){c.beginPath();c.moveTo(sgn*r*0.55,-r*0.75);c.quadraticCurveTo(sgn*r*1.05,-r*1.05,sgn*r*0.85,-r*1.55);c.quadraticCurveTo(sgn*r*0.75,-r*1.0,sgn*r*0.3,-r*0.9);c.closePath();c.fill();c.stroke();}
    c.beginPath();for(let k=0;k<7;k++){const a=Math.PI*0.15+k*Math.PI*0.7/6,x=Math.cos(a)*r*1.15,y=Math.sin(a)*r*0.95;k?c.lineTo(x,y):c.moveTo(x,y);c.lineTo(Math.cos(a+0.05)*r*1.35,Math.sin(a+0.05)*r*1.15);}c.fill();c.stroke();}

  c.fillStyle=beam;c.beginPath();c.moveTo(80,0);c.lineTo(110,0);c.lineTo(150,150);c.lineTo(40,150);c.closePath();c.fill();

function cellAt(e){const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>=r.width||y>=r.height)return null;return {i:Math.floor(y/cell)*R.N+Math.floor(x/cell),x,y};}
cv.addEventListener('pointerdown',e=>{
  audio();Music.start();if(!R||R.paused)return;const h=cellAt(e);if(!h)return;
  const C=R.cells[h.i];if(!C||C.k==='lock')return;
  cv.setPointerCapture(e.pointerId);drag={from:h.i,x:h.x,y:h.y,sx:h.x,sy:h.y,moved:false};
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>6)drag.moved=true;});
function dropDrag(){
  if(!drag)return;const from=drag.from;
  if(drag.moved&&R.cells[from]){
    const snap=snapTarget(from,drag.x,drag.y);
    if(snap!=null){const res=runMove(from,snap,true);if(res==='merge'&&tutoStep===1)tutoNext();}
    else{const h=cellAt({clientX:drag.x+cv.getBoundingClientRect().left,clientY:drag.y+cv.getBoundingClientRect().top});
      if(h&&!R.cells[h.i]){runMove(from,h.i,true);fx.back={i:h.i,x:drag.x,y:drag.y-8,t:0};}
      else fx.back={i:from,x:drag.x,y:drag.y-8,t:0};}
  }
  drag=null;
}
cv.addEventListener('pointerup',dropDrag);
cv.addEventListener('pointercancel',dropDrag);

function countUp(el,from,to,ms=900){const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function flyShards(fromEl,toEl,n,onEach){
  if(!fromEl||!toEl||!motionOK()){if(onEach)for(let i=0;i<n;i++)onEach();return;}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,bx=b.left+b.width/2,by=b.top+b.height/2;
  for(let i=0;i<n;i++){const el=document.createElement('div');el.className='fly';el.innerHTML=ic('shard','is');document.body.appendChild(el);
    const sx=ax+rnd(-40,40),sy=ay+rnd(-30,30),cx=(sx+bx)/2+rnd(-80,80),cy2=Math.min(sy,by)-rnd(40,120),t0=performance.now()+i*45,D=520;
    const step=now=>{const k=Math.max(0,Math.min(1,(now-t0)/D));if(k<=0){requestAnimationFrame(step);return;}const u=1-k,x=u*u*sx+2*u*k*cx+k*k*bx,y=u*u*sy+2*u*k*cy2+k*k*by;el.style.transform=`translate(${x-12}px,${y-12}px) scale(${1.2-0.5*k})`;el.style.opacity=k>0.9?String((1-k)*10):'1';if(k<1)requestAnimationFrame(step);else{el.remove();if(onEach)onEach();}};
    requestAnimationFrame(step);}
}

function notifPlan(now=Date.now()){

  const rs=S.build.map(b=>({at:Math.max(b.until,now+60e3),t:upById(b.id).t})) /* v10.8 : à toute heure, nuit comprise */.filter(r=>r.at<now+7*24*H).sort((a,b)=>a.at-b.at);

/* réveil (ouverture ou retour au premier plan) : le serveur fait foi, calcule le hors-ligne et les résultats de ligue */
let booted=false;
async function wake(){const d=await actAsync('hello').catch(()=>null);if(!d||!d.ok){if(!booted&&S.st.kills>0)setTimeout(()=>{if($('veil').hidden)loginModal();},400);booted=true;return;}
  renderJok();renderTab();refresh();if(R)renderTB();renderActs();
  const o=d.result&&d.result.offline;if(o&&(o.sparks>0||o.stages>0)){if(R&&o.stages)R.E=enemyFor(S.run.stage);if($('veil').hidden)offlineModal(o);}

  netGuild(true).then(()=>{refresh();if(tab==='clan')renderTab();});
  if(!booted){booted=true;track('open',{lang:LANG,stage:S.run.stage,best:S.bestStage});if(S.st.kills>0)setTimeout(()=>{if($('veil').hidden)loginModal();},600);}
}
function netBoot(){wake();}
function leagueModal(r){const show=()=>modal(`<div class="mart" style="color:var(--beam)">${ic('trophy')}</div><h2>${t('lg_res_title')}</h2><p>${t('lg_res_p',{r:r.rank,n:r.size})}</p><div class="loot">${ic('gem','ig')}+${r.gems} · ${ic('spark','ie')}+${fmt(r.sparks||0)}</div><p class="sub">${t('lg_res_sub',{t:dur(CFG.league.minutes(r.rank)*60)})}</p><div class="acts"><button class="b b-gold" id="lgClaim" data-gems="${r.gems}">${t('claim')}</button></div>`);if($('veil').hidden)show();else{const prev=modalOnClose;modalOnClose=()=>{if(prev)prev();setTimeout(show,200);};}}
/* retours du serveur : refus → l'état officiel a déjà remplacé le nôtre, on prévient ; anomalies → rien à dire au joueur honnête */
onServer=({action,d,fail})=>{
  if(fail){if(fail==='auth'){if(AUTH&&!window.__recovering){window.__recovering=true;netRecover().then(d=>adoptIdentity(d)).catch(()=>{toast(t('srv_auth'));});}else toast(t('srv_auth'));}else if(fail==='banned'){$('netMsg').textContent=t('srv_banned');setOnline(false);}return;}
  if(d&&d.result&&d.result.ok===false&&action!=='sync'&&action!=='hello'&&action!=='gift_offer'){toast(t('srv_refused'));}
  if(R&&boardN()!==R.N)growBoard();
  if(R)for(const id of S.equip)if(S.jk[id]&&R.jk[id]==null)R.jk[id]=0;
  refresh();if(R)renderTB();renderActs();if(tab!=='home'&&action!=='sync')renderTab();
};
