<title>Prisme Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* avoid-ai-design-ignore-file: C1, M4 */
/* Choix assumés : C1 (le violet est l'une des six couleurs du spectre : c'est le sujet du jeu, pas un dégradé par défaut) */
/* M4 (jeu mobile : les rebonds sont voulus, ils répondent aux actions du joueur) */
/* Nuit prismatique. Accueil = une scène (faisceau de lumière, gemme du joueur, route des niveaux, combat, trois orbes) ;
   partie = arène + plateau-écrin + outils ronds. La couleur vient du spectre des pièces ; l'interface reste en dalles indigo mates. */
:root{
  --night:#0d1530; --night-2:#142042; --slab:#1b2a55; --slab-hi:#24376b; --edge:#080d22; --line:#2f4380;
  --light:#fff6e4; --mist:#bfcbe8; --faint:#8391bb;
  --beam:#ffc857; --beam-hi:#ffe3a1; --beam-edge:#b8700f; --on-beam:#3b2000;
  --gem:#d48cff; --gem-edge:#6d2fa6; --shard:#7fe2ff; --shard-edge:#1f7c9c;
  --ok:#7df0b0; --danger:#ff5a6e;
  --s1:#ff5e7e; --s2:#ffb347; --s3:#ffe66d; --s4:#6cf0c2; --s5:#5ec8ff; --s6:#9d7bff;
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --wh:#5ec8ff;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--light);font:600 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(120% 55% at 50% -14%,rgba(255,214,150,.20),transparent 62%),
  linear-gradient(112deg,transparent 36%,rgba(255,94,126,.07) 41%,rgba(255,179,71,.07) 44%,rgba(255,230,109,.06) 47%,rgba(108,240,194,.06) 50%,rgba(94,200,255,.07) 53%,rgba(157,123,255,.07) 56%,transparent 61%)}
section{position:relative;z-index:1}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px}
.i{width:1.15em;height:1.15em;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ie{color:var(--beam)}.ig{color:var(--gem)}.is{color:var(--shard)}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px}

/* ---------- boutons en relief ---------- */
.b{--f:var(--slab-hi);--f2:var(--slab);--e:var(--edge);--t:var(--light);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:14px;margin-bottom:5px;
  background:linear-gradient(180deg,var(--f),var(--f2));color:var(--t);font:18px/1 var(--display);cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 5px 0 var(--e);transition:transform 70ms ease-out,box-shadow 70ms ease-out}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 1px 0 var(--e)}
.b:disabled{filter:grayscale(.85) brightness(.72);cursor:default}
.b .i{color:inherit}
.b-gold{--f:#ffdf99;--f2:var(--beam);--e:var(--beam-edge);--t:var(--on-beam)}
.b-gem{--f:#e8bbff;--f2:#b865f0;--e:var(--gem-edge);--t:#2a0a45}
.b-shard{--f:#bff2ff;--f2:#58c9ec;--e:var(--shard-edge);--t:#06283a}
.b-red{--f:#ff9aa8;--f2:var(--danger);--e:#8f1d2e;--t:#3a0710}
.b.sm{font-size:16px;padding:0 12px;border-radius:12px}
.b small{font:800 12px var(--body);display:inline-flex;align-items:center;gap:2px;opacity:.85}

/* ---------- barre des monnaies ---------- */
.top{display:flex;gap:8px;justify-content:space-between;padding-block:10px 2px}
.pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;border:0;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--light);font:18px var(--display);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}
.pill .i{width:30px;height:30px}
.pill small{font:800 12px var(--body);color:var(--mist);white-space:nowrap}
.pill .plus{width:18px;height:18px;border-radius:50%;background:var(--gem);color:#2a0a45;display:grid;place-items:center}
.pill .plus .i{width:12px;height:12px}

/* ---------- accueil : scène ---------- */
#home{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.stage{display:flex;flex-direction:column;align-items:center}
#me{width:172px;height:172px;display:block;cursor:pointer}
.pname{min-height:44px;background:none;border:0;padding:0 12px;margin-top:-8px;font:25px/1 var(--display);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptier{color:var(--mist);font-size:13px;margin-top:-4px;text-align:center}
.world{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.world h2{font:28px/1 var(--display);margin:0;color:var(--wh)}
.wst{display:inline-flex;align-items:center;gap:4px;color:var(--beam);font:17px var(--display)}
.route{position:relative;height:112px;margin:4px 22px 0}
.route svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:46px;height:46px;margin-left:-23px;border:0;padding:0;background:none;cursor:pointer;color:var(--light);font:18px var(--display)}
.node.boss{width:56px;height:56px;margin-left:-28px}
.node .nf{position:absolute;inset:0;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);background:linear-gradient(160deg,#4a5fa6,#18264f)}
.node .nf::after{content:"";position:absolute;inset:18%;clip-path:inherit;background:rgba(255,255,255,.10)}
.node.done .nf{background:linear-gradient(160deg,color-mix(in srgb,var(--wh) 55%,#fff),color-mix(in srgb,var(--wh) 75%,#000))}
.node.done{color:#0e0b28}
.node.cur .nf{background:linear-gradient(160deg,#fff4d6,var(--beam))}
.node.cur{color:var(--on-beam)}
.node.cur::before{content:"";position:absolute;inset:-7px;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);background:rgba(255,200,87,.35);animation:beat 1.1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1);opacity:.4}}
.node:disabled{cursor:default;color:var(--faint)}
.node:disabled .nf{background:linear-gradient(160deg,#1d2b58,#132041)}
.node .nl{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
.node .nl .i{width:24px;height:24px}
.node .pips{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);display:flex;gap:1px}
.node .pips i{width:9px;height:9px;background:var(--faint);clip-path:polygon(50% 0,63% 35%,100% 38%,71% 61%,80% 100%,50% 78%,20% 100%,29% 61%,0 38%,37% 35%)}
.node .pips i.on{background:var(--beam)}
.fight{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:20px;background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 0 var(--edge)}
#foe{width:84px;height:84px;display:block}
.flvl{font-size:13px;color:var(--mist);font-weight:800}
.fname{font:25px/1.05 var(--display)}
.fmeta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--mist);margin-top:4px}
.fmeta span{display:inline-flex;align-items:center;gap:4px}
.fmeta .i{color:var(--s1)}
.play{width:100%;min-height:62px;font-size:28px;margin-top:12px;border-radius:18px;justify-content:space-between;padding:0 14px 0 22px}
.play .cost{display:inline-flex;align-items:center;gap:4px;font-size:19px;background:rgba(59,32,0,.14);padding:7px 12px 7px 8px;border-radius:999px}
.orbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.orb{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--light);cursor:pointer;padding:4px 0;min-height:44px}
.oc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge));box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--edge);transition:transform 70ms ease-out}
.orb:active:not(:disabled) .oc{transform:translateY(3px) scale(.96)}
.oc .i{width:32px;height:32px}
.oc.ring{border:4px solid transparent;box-shadow:0 4px 0 var(--edge);background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge)) padding-box,conic-gradient(var(--beam) var(--p,0%),var(--line) 0) border-box}
.orb b{font:17px var(--display);margin-top:4px}
.orb small{font-size:12.5px;color:var(--mist);font-weight:800;white-space:nowrap}
.orb:disabled{cursor:default}
.o-titan .i{color:var(--s1)}.o-forge .i{color:var(--beam)}
.oc.hot{box-shadow:0 4px 0 var(--edge),0 0 18px rgba(255,200,87,.55);animation:hot 1.6s ease-in-out infinite alternate}@keyframes hot{to{box-shadow:0 4px 0 var(--edge),0 0 30px rgba(255,200,87,.9)}}.o-atelier .i{color:var(--mist)}
.badge{position:absolute;top:6px;right:calc(50% - 24px);width:13px;height:13px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 3px var(--night)}
.orb .badge{top:2px;right:calc(50% - 34px)}

/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,var(--night-2),var(--edge));box-shadow:0 -2px 0 var(--line)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;background:none;border:0;color:var(--mist);font:800 12px var(--body);cursor:pointer}
.nav button .i{width:27px;height:27px;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.nav button[aria-selected="true"]{color:var(--light)}
.nav button[aria-selected="true"] .i{color:var(--beam);transform:translateY(-3px) scale(1.14)}

/* ---------- onglets ---------- */
.phead{padding:10px 2px 6px}
.ttl{font:32px/1 var(--display);margin:0}
.sub{margin:4px 0 0;color:var(--mist);font-size:14px}
h2.sec{font:21px var(--display);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font:800 13px var(--body);color:var(--mist)}
.note{color:var(--mist);font-size:13px;margin:8px 2px}
.slab{background:linear-gradient(180deg,var(--slab-hi),var(--slab));border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 var(--edge)}
.list{display:flex;flex-direction:column;gap:10px}
/* atelier */
.slot{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.slot.empty{display:flex;min-height:60px;gap:10px;padding:0 14px;border-radius:16px;border:2px dashed var(--line);color:var(--mist);font-weight:800;font-size:14px}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--night-2) 60%,transparent 62%),conic-gradient(var(--beam) var(--p,0%),var(--edge) 0)}
.ring .i{width:26px;height:26px}
.slot b{display:block;font:17px/1.1 var(--display)}
.slot .tm{display:inline-flex;align-items:center;gap:4px;color:var(--beam);font-weight:800;font-size:14px}
.slot-acts{display:flex;flex-direction:column;gap:2px}
.slotbuy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mist);font-size:13px}
.grp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.grp button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--mist);font:800 12px var(--body);cursor:pointer;padding:0 2px}
.grp button .i{width:24px;height:24px}
.grp button[aria-pressed="true"]{background:linear-gradient(180deg,var(--slab-hi),var(--slab));color:var(--light);box-shadow:inset 0 0 0 2px var(--beam)}
.grp .badge{top:4px;right:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:0}
.tile[data-g="atk"]{--gc:var(--s1)}.tile[data-g="grid"]{--gc:var(--s5)}.tile[data-g="def"]{--gc:var(--s4)}.tile[data-g="eco"]{--gc:var(--s2)}.tile[data-g="jok"]{--gc:var(--s6)}
.tile-top{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:8px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:44px}
.tico{grid-row:1/3;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 70%,#fff),color-mix(in srgb,var(--gc) 75%,#000));color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tico .i{width:26px;height:26px}
.tname{font:16px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis}
.tlvl{font-size:12.5px;color:var(--mist);font-weight:800}
.pips{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.pips i{display:block;height:100%;background:var(--gc,var(--beam))}
.tile .b{width:100%;justify-content:space-between;padding:0 10px}
.tstate{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--edge);color:var(--mist);font-weight:800;font-size:13px;margin-bottom:5px}
.tstate.run{color:var(--beam)}
.tile.locked .tico{filter:grayscale(1);opacity:.55}
.tile.locked .tname{color:var(--mist)}
.jcard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px}
.jcard.on{box-shadow:inset 0 0 0 2px var(--gem),0 4px 0 var(--edge)}
.jart{width:58px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);background:linear-gradient(160deg,#f3d3ff,#8e45d0);color:#2a0a45}
.jart .i{width:30px;height:30px}
.jcard.locked .jart{background:linear-gradient(160deg,#34498a,#18264f);color:var(--faint)}
.jcard b{font:19px var(--display)}
.jl{font-size:12.5px;color:var(--gem);font-weight:800;margin-left:6px}
.jcard p{margin:4px 0 0;color:var(--mist);font-size:13.5px}
.jcard .jmeta{color:var(--light);font-weight:800;font-size:13px}
.jbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.jbtns .d{color:var(--beam);font-weight:800;font-size:13px;display:inline-flex;gap:4px;align-items:center}
/* quêtes */
.quest{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px}
.quest.hl{box-shadow:inset 0 0 0 2px var(--beam),0 4px 0 var(--edge)}
.quest.done{opacity:.55}
.qic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--edge);color:var(--mist)}
.qic .i{width:22px;height:22px}
.quest.hl .qic{background:var(--beam);color:var(--on-beam)}
.quest.hl .qbar span{color:var(--on-beam);text-shadow:none}
.qbody b{display:block;font-weight:800;font-size:15px;line-height:1.25}
.qbar{position:relative;height:18px;border-radius:9px;background:var(--edge);overflow:hidden;margin:6px 0}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,var(--beam-hi),var(--beam));border-radius:9px}
.qbar span{position:relative;display:block;text-align:center;font:800 12px/18px var(--body);text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.rew{display:inline-flex;gap:6px;flex-wrap:wrap}
.rew span{display:inline-flex;align-items:center;gap:3px;background:var(--edge);border-radius:999px;padding:3px 9px 3px 5px;font-weight:800;font-size:13px}
.chap{height:12px;border-radius:6px;background:var(--edge);overflow:hidden;margin:0 2px 12px}
.chap i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
/* ligue */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:10px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod canvas{width:40px;height:40px}
.pod .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:30px var(--display);color:#150f33;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.pod.p1 .blk{height:88px;background:linear-gradient(180deg,var(--beam-hi),var(--beam))}
.pod.p2 .blk{height:68px;background:linear-gradient(180deg,#eef0ff,#b9bde8)}
.pod.p3 .blk{height:54px;background:linear-gradient(180deg,#ffd0a8,#e08b52)}
.lg{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto 44px;gap:8px;align-items:center;min-height:48px;padding:0 4px 0 10px;border-radius:12px;background:var(--night-2)}
.lg.me{background:linear-gradient(180deg,var(--slab-hi),var(--slab));box-shadow:inset 0 0 0 2px var(--beam)}
.lg .rk{font:17px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg.up .rk{color:var(--ok)}.lg.down .rk{color:var(--danger)}
.lg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.lg .sc{font:16px var(--display);color:var(--mist);font-variant-numeric:tabular-nums}
.lg canvas{width:26px;height:26px}
.zone{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:6px 4px}
.zone.upz{color:var(--ok)}.zone.downz{color:var(--danger)}
.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35;border-radius:1px}
.rep{width:44px;height:44px;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;border-radius:12px}
.rep:disabled{color:var(--ok)}
/* boutique */
.offer{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.oart{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle at 40% 30%,var(--slab-hi),var(--edge))}
.oart .i{width:40px;height:40px}
.offer b,.gitem b{font:18px/1.1 var(--display)}
.offer p{margin:3px 0 0;color:var(--mist);font-size:13px}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gitem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 10px 8px;min-width:0}
.gitem .oart{width:56px;height:56px}
.gitem p{margin:0;color:var(--mist);font-size:12.5px;min-height:3em}
.gitem .b{width:100%}
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font:800 12.5px var(--body);min-height:44px}
.skin[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--beam)}
.skin canvas{width:40px;height:40px}
.skin span{color:var(--mist)}
.demo{color:var(--mist);font-size:13px;display:flex;gap:6px;align-items:center}
/* profil */
.field{display:flex;gap:8px;align-items:flex-start}
.field input{flex:1;min-width:0;min-height:46px;background:var(--edge);border:2px solid var(--line);border-radius:14px;padding:0 12px;color:var(--light);font:700 16px var(--body)}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:4px 2px 0;font-weight:800}
.switch{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 14px;font-weight:800;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.switch input:checked{background:var(--ok);box-shadow:none}
.switch input:checked::after{transform:translateX(22px);background:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px}
.stat b{display:block;font:22px var(--display)}
.stat span{color:var(--mist);font-size:12.5px;font-weight:800}
.best{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;background:var(--night-2);font-weight:800}
.best .i{color:var(--beam)}
.best span:last-child{color:var(--mist);font-size:13px}

/* ---------- partie ---------- */
#game{height:100%;display:flex;flex-direction:column}
.gwrap{max-width:480px;width:100%;margin:0 auto;padding:8px 16px 10px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) 44px;gap:10px;align-items:center}
.quit{width:44px;height:44px;border-radius:14px;border:0;display:grid;place-items:center;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--line);color:var(--mist);cursor:pointer}
.quit .i{width:20px;height:20px}
.hud-lvl{font-size:13px;color:var(--mist);font-weight:800}
.hud-name{font:23px/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:left}
.clock b{display:block;font:22px/1 var(--display);font-variant-numeric:tabular-nums}
.clock span{display:flex;gap:1px;color:var(--beam);min-height:16px}
.clock .i{width:15px;height:15px}
.clock .off{color:var(--line)}
.arena{flex:none;display:flex;flex-direction:column;gap:5px}
#bossCv{width:100%;height:clamp(104px,22vh,230px);display:block}
.hp{position:relative;height:24px;border-radius:12px;background:var(--edge);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0}
#hpLag{background:#fff;opacity:.6}
#hpBar{background:linear-gradient(180deg,#ff9aa8,var(--danger));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.hp.titan #hpBar{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
.hp span{position:relative;display:block;text-align:center;font:15px/24px var(--display);text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.bst{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--mist);font-weight:800}
.atk{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.atk i{display:block;height:100%;background:var(--danger)}
#bstat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bstat.rage{color:var(--danger)}#bstat.shield{color:var(--shard)}
.boardwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--wh) 16%,transparent),transparent 70%)}
#board{display:block;touch-action:none;border-radius:20px}
.warn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:26px var(--display);color:#fff;text-align:center;pointer-events:none;background:var(--danger);border-radius:16px;padding:10px 18px;white-space:nowrap;box-shadow:0 5px 0 #8f1d2e}
.warn.soft{background:var(--slab-hi);color:var(--light);font-size:19px;box-shadow:0 5px 0 var(--edge);opacity:.92}
.hint{background:var(--light);color:var(--night);border-radius:14px;padding:9px 12px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
.tools{display:flex;gap:8px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.jok,.boost{display:flex;gap:8px}
.sep{width:2px;align-self:stretch;background:var(--line);border-radius:1px;margin:6px 2px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--light);cursor:pointer;width:62px;padding:0;font:800 12px var(--body)}
.tool .oc{width:54px;height:54px}
.tool .oc .i{width:28px;height:28px}
.tool:active .oc{transform:translateY(3px) scale(.96)}
.tool .cnt{position:absolute;top:-2px;right:-2px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--light);color:var(--night);font:14px/24px var(--display);display:inline-flex;align-items:center;gap:2px}
.tool .cnt.pay{background:var(--gem);color:#2a0a45}
.tool .cnt .i{width:12px;height:12px}
.tool[aria-pressed="true"] .oc{box-shadow:inset 0 0 0 3px var(--beam),0 4px 0 var(--edge)}
.tool small{font:800 12px var(--body);color:var(--mist)}
.jtool .oc{border:4px solid transparent;box-shadow:0 4px 0 var(--edge);background:radial-gradient(circle at 35% 30%,var(--slab-hi),var(--edge)) padding-box,conic-gradient(var(--gem) var(--p,0%),var(--line) 0) border-box;color:var(--gem)}
.jtool.ready .oc{background:radial-gradient(circle at 35% 30%,#f3d3ff,#8e45d0) padding-box,conic-gradient(var(--gem) 100%,var(--gem) 0) border-box;color:#2a0a45;animation:jready 650ms ease-in-out infinite alternate}
.jtool.ready small{color:var(--gem)}
@keyframes jready{to{transform:scale(1.08)}}

/* ---------- modales ---------- */
.veil{position:fixed;inset:0;background:rgba(6,10,28,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{width:100%;max-width:380px;border-radius:26px;padding:22px 20px 16px;background:linear-gradient(180deg,#2a3f7a,var(--slab));box-shadow:inset 0 2px 0 rgba(255,255,255,.16),0 6px 0 var(--edge);text-align:center;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;animation:mpop 280ms cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{from{transform:scale(.86);opacity:0}}
.modal h2{font:29px/1.05 var(--display);margin:0}
.modal p{margin:0;color:var(--mist)}
.modal .big{font:44px/1 var(--display);color:var(--shard);font-variant-numeric:tabular-nums}
.modal .loot{display:inline-flex;align-items:center;gap:6px;font:24px var(--display);color:var(--shard);justify-content:center}
.modal .loot .i{width:30px;height:30px}
.mart{display:grid;place-items:center}
.mart .i{width:66px;height:66px}
.acts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.acts .b{width:100%}
.acts .row{display:flex;gap:8px}.acts .row .b{flex:1}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px}
.stars span .i{width:54px;height:54px;color:var(--edge)}
.stars span:nth-child(2) .i{width:66px;height:66px}
.stars .on .i{color:var(--beam);animation:starpop 460ms cubic-bezier(.34,1.56,.64,1) both}
.stars .on:nth-child(2) .i{animation-delay:.16s}.stars .on:nth-child(3) .i{animation-delay:.32s}
@keyframes starpop{from{transform:scale(0) rotate(-45deg)}}
.ad{font:68px/1 var(--display);color:var(--beam)}
.login{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ltile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--edge);font-size:12.5px;font-weight:800;min-height:56px;justify-content:center}.ltile small{color:var(--mist);font-size:11.5px}.ltile span{display:inline-flex;align-items:center;gap:3px}.ltile.past{opacity:.45}.ltile.today{box-shadow:inset 0 0 0 2px var(--beam);background:var(--slab-hi)}.ltile:last-child{grid-column:span 1}
.fly{position:fixed;left:0;top:0;width:24px;height:24px;z-index:30;pointer-events:none;filter:drop-shadow(0 0 6px rgba(127,226,255,.9))}.fly .i{width:24px;height:24px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--light);color:var(--night);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin 240ms cubic-bezier(.34,1.56,.64,1)}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
@media (max-height:740px){
  .top{padding-block:6px 0}
  #me{width:118px;height:118px}.pname{font-size:22px;margin-top:-10px}.ptier{font-size:12.5px}
  .route{height:90px;margin-top:0}.fight{margin-top:8px;padding:6px 12px;grid-template-columns:60px 1fr}.fmeta{display:none}#foe{width:64px;height:64px}.fname{font-size:21px}
  .play{min-height:54px;font-size:24px;margin-top:8px}.oc{width:52px;height:52px}.oc .i{width:26px;height:26px}.orb b{font-size:15px;margin-top:2px}.orbs{margin-top:6px}
  .nav button{min-height:52px}#home{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ================= réglages (tout l'équilibrage est ici) ================= */

const UPG=[

  {id:'crit',g:'atk',t:'Coup critique',d:k=>`${3*(k+1)} % de chance d'infliger ×3`,c:k=>150*Math.pow(2.1,k),time:T(45,2),max:10,req:4},
  {id:'combo',g:'atk',t:'Élan',d:k=>`Chaque fusion enchaînée ajoute +${10+2*(k+1)} % de dégâts`,c:k=>120*Math.pow(2,k),time:T(40,2),max:10,req:6},
  {id:'pierce',g:'atk',t:'Perce-bouclier',d:k=>`Le bouclier des boss laisse passer ${k+1} niveau${k?'x':''} de gemme de plus`,c:k=>6000*Math.pow(6,k),time:T(3600,4),max:2,req:11},

  {id:'lucky',g:'grid',t:'Étincelle',d:k=>`${5*(k+1)} % de chance d'apparaître un niveau au-dessus`,c:k=>60*Math.pow(2.1,k),time:T(30,1.9),max:10},
  {id:'chain',g:'grid',t:'Réaction en chaîne',d:k=>`${5*(k+1)} % de chance qu'une fusion en déclenche une autre`,c:k=>120*Math.pow(2.3,k),time:T(45,2),max:10,req:3},
  {id:'calm',g:'grid',t:'Calme',d:k=>`Apparitions ${6*(k+1)} % plus lentes`,c:k=>40*Math.pow(1.85,k),time:T(20,1.9),max:10},
  {id:'board',g:'grid',t:'Grand plateau',d:()=>'Plateau 6 × 6 au lieu de 5 × 5',c:()=>2500,time:()=>7200,max:1,req:15},
  {id:'dodge',g:'def',t:'Esquive',d:k=>`${6*(k+1)} % de chance d'esquiver une attaque`,c:k=>200*Math.pow(2.2,k),time:T(60,2),max:8,req:5},
  {id:'cool',g:'def',t:'Sang-froid',d:k=>`La rage arrive ${10*(k+1)} % plus tard`,c:k=>250*Math.pow(2.2,k),time:T(60,2),max:10,req:8},
  {id:'sursis',g:'def',t:'Sursis',d:k=>`${(CFG.grace+0.5*(k+1)).toFixed(1)} s pour libérer un plateau plein`,c:k=>400*Math.pow(3,k),time:T(300,3),max:4,req:12},
  {id:'loot',g:'eco',t:'Butin',d:k=>`+${10*(k+1)} % d'éclats par partie`,c:k=>80*Math.pow(2,k),time:T(40,1.9),max:10},
  {id:'gold',g:'eco',t:'Chasseur d\'or',d:k=>`+${k+1} % de gemmes dorées, qui rapportent des éclats`,c:k=>150*Math.pow(2,k),time:T(60,1.9),max:10,req:7},
  {id:'prod',g:'eco',t:'Forge passive',d:k=>`Production : ${fmt(CFG.idle.rate(k+1))} éclats / h`,c:k=>50*Math.pow(1.75,k),time:T(30,1.6),max:20},
  {id:'cap',g:'eco',t:'Réserve',d:k=>`La forge stocke ${CFG.idle.capH(k+1)} h de production`,c:k=>200*Math.pow(2.4,k),time:T(300,2.2),max:6},
  {id:'battery',g:'eco',t:'Batterie',d:k=>`Énergie maximale : ${CFG.energy.max+2*(k+1)}`,c:k=>300*Math.pow(2.3,k),time:T(600,2),max:10,req:9},
  {id:'catal',g:'jok',t:'Catalyseur',d:k=>`Tes jokers se chargent ${8*(k+1)} % plus vite`,c:k=>2000*Math.pow(2.2,k),time:T(900,2),max:8,req:8},
];
const JOKERS=[
  {id:'chameleon',t:'Caméléon',lvl:8,sh:1200,gm:50,base:14,d:l=>`Pose ${l>=4?'2 jokers':'1 joker'} sur le plateau : il fait monter d'un niveau n'importe quelle gemme, jusqu'à ${1+l} niveau${l>0?'x':''} au-dessus de tes gemmes de départ.`},
  {id:'magnet',t:'Aimant',lvl:12,sh:3500,gm:80,base:22,d:l=>`Fusionne d'un coup jusqu'à ${2+l} paires de gemmes identiques.`},
  {id:'surge',t:'Surcharge',lvl:16,sh:8000,gm:110,base:20,d:l=>`Dégâts ×2 pendant ${6+2*l} s.`},
  {id:'frost',t:'Gel',lvl:22,sh:18000,gm:140,base:18,d:l=>`Gèle les attaques ennemies ${8+2*l} s et les apparitions ${3+l} s.`},
  {id:'prism',t:'Prisme',lvl:28,sh:40000,gm:170,base:22,d:l=>`Fait monter d'un niveau tes ${2+l} plus petites gemmes.`},
  {id:'meteor',t:'Météore',lvl:35,sh:90000,gm:200,base:28,d:l=>`Frappe comme une gemme deux niveaux au-dessus de ta plus grosse${l>1?`, ×${(1+0.5*(l-1)).toFixed(1)}`:''}.`},
  {id:'breaker',t:'Brise-bouclier',lvl:45,sh:220000,gm:240,base:16,d:l=>`Désactive le bouclier d'un boss pendant ${8+3*l} s.`},
];
const JUPG=JOKERS.map(j=>({id:'j_'+j.id,g:'jok',joker:j.id,t:j.t,d:k=>j.d(k+1),c:k=>j.sh*0.8*Math.pow(2.2,k-1),time:k=>Math.min(86400,Math.round(1200*Math.pow(3,k-1))),max:5}));
const ALLUP=UPG.concat(JUPG);

const WORLDS=[{n:'Néon',h:188,k:0},{n:'Magma',h:22,k:-3},{n:'Abysses',h:255,k:2},{n:'Aurore',h:145,k:-5},{n:'Prisme',h:310,k:5}];
const worldOf=n=>Math.floor((n-1)/10)+1;
function worldInfo(w){const b=WORLDS[(w-1)%WORLDS.length];const cyc=Math.floor((w-1)/WORLDS.length);return {name:b.n+(cyc?' '+['II','III','IV','V','VI','VII'][Math.min(cyc-1,5)]:''),h:b.h,k:b.k,col:`hsl(${b.h} 100% 62%)`};}

/* ================= utilitaires ================= */
const $=id=>document.getElementById(id);
const U=['k','M','Md','Bn'];
function fmt(n){
  if(!isFinite(n))return '∞';
  n=Math.floor(n);
  if(n<10000)return n<1000?String(n):Math.floor(n/1000)+'\u202f'+String(n%1000).padStart(3,'0');
  let e=Math.floor(Math.log10(n)/3);let v=n/Math.pow(10,e*3);
  if(v>=999.5){e++;v=n/Math.pow(10,e*3);}
  const suf=e<=4?U[e-1]:String.fromCharCode(97+Math.floor((e-5)/26)%26)+String.fromCharCode(97+(e-5)%26);
  return (v<100?v.toFixed(1).replace(/\.0$/,''):v.toFixed(0)).replace('.',',')+'\u202f'+suf;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const dur=s=>{s=Math.max(0,Math.ceil(s));if(s<60)return s+' s';if(s<3600)return Math.ceil(s/60)+' min';if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+' h'+(m?' '+String(m).padStart(2,'0'):'');}const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d+' j'+(h?' '+h+' h':'');};
const clock=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekKey(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return dayKey(d.getTime());}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const I={e:ic('bolt','ie'),g:ic('gem','ig'),s:ic('shard','is')};

/* ================= pseudos ================= */
const ADJ=['Cobalt','Fulgurant','Pourpre','Stellaire','Vif','Polaire','Ardent','Lunaire','Électrique','Sombre','Radieux','Quantique'];
const NOUN=['Hexagone','Prisme','Pentagone','Comète','Spirale','Vecteur','Nova','Pulsar','Octogone','Photon','Orbite','Fractale'];
const randomName=()=>NOUN[Math.floor(Math.random()*NOUN.length)]+' '+ADJ[Math.floor(Math.random()*ADJ.length)]+' '+Math.floor(rnd(10,999));
const BAN_SUB=['connard','connasse','salope','salaud','pute','putain','encule','enculer','merde','bite','couille','nique','niquer','batard','enfoire','fuck','shit','bitch','cunt','dick','nigg','negr','nazi','hitler','whore','faggot','pussy','asshole','retard','slut','pedo','viol','tapette','gouine','bougnoul','youpin','chienne'];
const BAN_WORD=['con','conne','pd','fdp','ntm','tg','nazi','cul','fag','kkk','ss'];
function normName(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/7/g,'t');}
function checkName(raw){
  const s=raw.trim().replace(/\s+/g,' ');
  if(s.length<3)return {ok:false,msg:'3 caractères minimum.'};
  if(s.length>16)return {ok:false,msg:'16 caractères maximum.'};
  if(!/^[\p{L}\p{N} _-]+$/u.test(s))return {ok:false,msg:'Lettres, chiffres, espaces, - et _ uniquement.'};
  const n=normName(s),words=n.split(/[\s_-]+/).map(w=>w.replace(/[^a-z]/g,'')),flatRaw=n.replace(/[^a-z]/g,''),flat=flatRaw.replace(/(.)\1+/g,'$1');
  if(BAN_SUB.some(b=>flatRaw.includes(b)||flat.includes(b.replace(/(.)\1+/g,'$1')))||words.some(w=>BAN_WORD.includes(w))||BAN_WORD.includes(flatRaw))return {ok:false,msg:'Ce pseudo contient un mot interdit.'};
  return {ok:true,name:s};
}

/* ================= état du joueur ================= */
const SKINS=[{id:'cyan',label:'Cyan',price:0,c:'#3ef2ff'},{id:'rose',label:'Magenta',price:40,c:'#ff3ec8'},{id:'or',label:'Or',price:80,c:'#ffd23e'},{id:'prisme',label:'Prisme',price:150,c:'rainbow'}];
function fresh(){
  const now=Date.now();
  return {v:2,gems:20,shards:0,energy:CFG.energy.max,energyT:now,level:1,stars:{},maxLvl:1,
    up:Object.fromEntries(UPG.map(u=>[u.id,0])),boosters:{hammer:0,glass:0,bolt:0},jk:{},equip:[],jslots:1,build:[],slots:1,
    idle:{bank:0,t:now},lootX2:false,noAds:false,starter:false,adCount:0,
    name:randomName(),nameChanges:0,flagged:0,skin:'cyan',skins:['cyan'],
    st:{tuto:false,wins:0,games:0,inf:0,merges:0,collects:0,boosters:0,bought:0,started:0,three:0,infBest:0,bosses:0,minis:0,jokerUses:0,maxCombo:0,days:1,lastDay:dayKey()},
    day:{k:dayKey(),games:0,wins:0,merges:0,ads:0,energyAds:0,buildAds:0,inf:0,collects:0,jokers:0,three:0,combo:0,claimed:[]},login:{streak:0,last:'',claimed:''},offerAt:0,
    week:{k:weekKey(),wins:0,inf:0,collects:0,best:0,claimed:[]},
    onb:[],league:null,bestiary:{},settings:{music:true,sound:true,fx:true}};
}
let S=fresh();
const KEY='prisme-fusion-v4';
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===2){const f=fresh();S=Object.assign(f,o);S.up=Object.assign(f.up,o.up);S.st=Object.assign(f.st,o.st);S.settings=Object.assign(f.settings,o.settings);S.boosters=Object.assign(f.boosters,o.boosters);}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function roll(){if(S.st.lastDay!==dayKey()){S.st.days++;S.st.lastDay=dayKey();}if(S.day.k!==dayKey()){S.day={k:dayKey(),games:0,wins:0,merges:0,ads:0,energyAds:0,buildAds:0,inf:0,collects:0,jokers:0,three:0,combo:0,claimed:[]};}if(!DAILY.length||DAILY.k!==S.day.k){pickDaily();DAILY.k=S.day.k;}if(S.week.k!==weekKey()){S.week={k:weekKey(),wins:0,inf:0,collects:0,best:0,claimed:[]};S.league=null;}}

/* ================= énergie ================= */
const emax=()=>CFG.energy.max+2*S.up.battery;
function regen(now=Date.now()){
  const E=CFG.energy,M=emax();
  if(S.energy>=M){S.energyT=now;return;}
  const k=Math.floor((now-S.energyT)/1000/E.regenSec);
  if(k>0){S.energy=Math.min(M,S.energy+k);S.energyT+=k*E.regenSec*1000;if(S.energy>=M)S.energyT=now;}
}
const nextEnergyIn=()=>S.energy>=emax()?0:CFG.energy.regenSec-(Date.now()-S.energyT)/1000;
function spendEnergy(){regen();if(S.energy<CFG.energy.cost)return false;if(S.energy>=emax())S.energyT=Date.now();S.energy-=CFG.energy.cost;return true;}
function give(r){if(!r)return;if(r.g)S.gems+=r.g;if(r.e)S.energy+=r.e;if(r.s)S.shards+=r.s;if(r.b)for(const k in r.b)S.boosters[k]+=r.b[k];}
function rewardHtml(r){const o=[];if(r.g)o.push(`<span>${I.g}${r.g}</span>`);if(r.e)o.push(`<span>${I.e}${r.e}</span>`);if(r.s)o.push(`<span>${I.s}${fmt(r.s)}</span>`);if(r.b)for(const k in r.b)o.push(`<span>${ic(BICON[k],'ie')}${BNAME[k]} ×${r.b[k]}</span>`);return `<span class="rew">${o.join('')}</span>`;}

/* ================= calendrier de connexion ================= */
const LOGIN=[{e:10},{g:10},{s:200},{e:15},{g:20},{b:{glass:2}},{joker:true}];
function loginState(){roll();const today=dayKey();if(S.login.last===today)return {day:S.login.streak,claimedToday:S.login.claimed===today};
  const y=new Date();y.setDate(y.getDate()-1);const consecutive=S.login.last===dayKey(y.getTime());
  S.login.streak=consecutive?(S.login.streak%7)+1:1;S.login.last=today;return {day:S.login.streak,claimedToday:false};}
function claimLogin(){const st=loginState();if(st.claimedToday)return false;S.login.claimed=dayKey();const r=LOGIN[st.day-1];
  if(r.joker){const j=JOKERS.find(x=>!S.jk[x.id]);if(j){S.jk[j.id]=1;if(S.equip.length<S.jslots)S.equip.push(j.id);}else S.gems+=50;}else give(r);return true;}
function loginModal(){const st=loginState();if(st.claimedToday)return false;
  const tiles=LOGIN.map((r,i)=>{const d=i+1,cls=d<st.day?'past':d===st.day?'today':'';const lab=r.joker?ic('spark','ig')+'Joker':r.g?ic('gem','ig')+r.g:r.e?ic('bolt','ie')+r.e:r.s?ic('shard','is')+r.s:ic('hourglass','ie')+'×2';return `<div class="ltile ${cls}"><small>Jour ${d}</small><span>${lab}</span></div>`;}).join('');
  modal(`<h2>Jour ${st.day} sur 7</h2><p>Reviens chaque jour : le septième jour offre un joker.</p><div class="login">${tiles}</div><div class="acts"><button class="b b-gold" id="loginGo">Récupérer</button></div>`);return true;}
/* ================= forge (production passive) ================= */
const idleRate=()=>CFG.idle.rate(S.up.prod);
const idleCap=()=>idleRate()*CFG.idle.capH(S.up.cap);
function accrue(now=Date.now()){S.idle.bank=Math.min(idleCap(),S.idle.bank+(now-S.idle.t)/3600e3*idleRate());S.idle.t=now;}
function collect(){accrue();const g=Math.floor(S.idle.bank);if(g<1)return 0;S.idle.bank-=g;S.shards+=g;S.st.collects++;roll();S.week.collects++;S.day.collects++;return g;}

/* ================= atelier ================= */
const upById=id=>ALLUP.find(x=>x.id===id);
const lvlOf=u=>u.joker?(S.jk[u.joker]||0):S.up[u.id];
const upCost=u=>(u.joker&&!S.jk[u.joker])||lvlOf(u)>=u.max?Infinity:u.c(lvlOf(u));
const upTime=u=>u.time(lvlOf(u));
const upLocked=u=>u.req&&S.level<u.req;
const inBuild=id=>S.build.find(b=>b.id===id);
function applyUp(id){const u=upById(id);if(u.id==='prod'||u.id==='cap')accrue();if(u.joker)S.jk[u.joker]=(S.jk[u.joker]||0)+1;else S.up[u.id]++;S.st.bought++;}
function tickBuild(now=Date.now()){const done=[];S.build=S.build.filter(b=>{if(now>=b.until){applyUp(b.id);done.push(b.id);return false;}return true;});return done;}
function startBuild(id,now=Date.now()){
  tickBuild(now);const u=upById(id);if(!u)return 'none';
  if(upLocked(u))return 'locked';if(inBuild(id))return 'busy';
  const c=upCost(u);if(!isFinite(c))return 'max';
  if(S.build.length>=S.slots)return 'slots';if(S.shards<c)return 'poor';
  S.shards-=c;S.st.started++;const d=upTime(u);S.build.push({id,until:now+d*1000,dur:d});return 'ok';
}
const rushGems=(b,now=Date.now())=>Math.max(1,Math.ceil((b.until-now)/1000/CFG.build.gemSec));
function rushBuild(id,now=Date.now()){const b=inBuild(id);if(!b)return false;const g=rushGems(b,now);if(S.gems<g)return false;S.gems-=g;b.until=now;tickBuild(now);return true;}
function adBuild(id,now=Date.now()){roll();const b=inBuild(id);if(!b||S.day.buildAds>=CFG.build.adPerDay)return false;S.day.buildAds++;b.until-=CFG.build.adCut*1000;tickBuild(now);return true;}
function buySlot(){const i=S.slots-1;if(i>=CFG.build.slotGems.length)return false;const g=CFG.build.slotGems[i];if(S.gems<g)return false;S.gems-=g;S.slots++;return true;}
/* ----- jokers : déblocage, équipement ----- */
const jokerById=id=>JOKERS.find(j=>j.id===id);
const jokerAvail=j=>S.level>=j.lvl;

const dmgOf=l=>Math.pow(CFG.dmg.base,l-1);
function buildDmg(T){let s=0;for(let k=2;k<=T;k++)s+=Math.pow(2,T-k)*dmgOf(k);return s;}
const themeIdx=w=>(w-1)%THEMES.length;
const weekTheme=()=>{const d=new Date(weekKey());return Math.floor(d.getTime()/(7*86400e3))%THEMES.length;};
function enemyFor(mode,n){
  if(mode==='inf'){const th=weekTheme();return {type:'titan',th,name:THEMES[th].titan,hp:Infinity,max:Infinity,phase:1,atkT:CFG.titan.atk0,atkEvery:CFG.titan.atk0,str:1,shieldL:0};}
  const E=CFG.enemy,type=E.type(n),th=themeIdx(worldOf(n)),max=Math.round(E.hp[type]*buildDmg(CFG.level.power(n)));

function newRun(mode,n){
  const N=S.up.board?6:5, w=mode==='level'?worldOf(n):weekTheme()+1;
  const power=mode==='level'?CFG.level.power(n):99;
  const sL=mode==='level'?Math.max(1,Math.min(1+S.up.spawn,power-3)):1+S.up.spawn;
  R={mode,n,w,N,cells:Array(N*N).fill(null),power,sL,t:0,spawnT:0,
    interval:(mode==='level'?CFG.level.spawn0(n):CFG.inf.spawn0)*(1+0.06*S.up.calm),
    state:'play',graceT:0,slowUntil:0,contUsed:false,score:0,dmg:0,merges:0,best:1,gold:0,combo:0,comboT:0,boostersUsed:0,paused:false,rage:0,why:''};
  R.E=enemyFor(mode,n);
  const nl=mode==='level'?CFG.level.locks(w):0;
  const free=[...Array(N*N).keys()].sort(()=>Math.random()-.5);
  for(let i=0;i<nl;i++)R.cells[free.pop()]={k:'lock'};
  R.cells[free.pop()]={l:R.sL};R.cells[free.pop()]={l:R.sL};R.cells[free.pop()]={l:R.sL};
  R.jk={};for(const id of S.equip)if(S.jk[id])R.jk[id]=0;R.surgeUntil=0;R.frostUntil=0;R.freezeSpawnUntil=0;R.breakUntil=0;
  R.par=mode==='level'?CFG.enemy.hp[R.E.type]*Math.pow(2,power-R.sL)/(1+0.05*S.up.lucky)*R.interval*CFG.enemy.parK:Infinity;
  const cool=1+0.1*S.up.cool;R.furyAt=Math.min(CFG.enemy.furyMax*cool,Math.max(CFG.enemy.furyMin,R.par*CFG.enemy.furyAt)*cool);R.rageAt=Math.min(R.furyAt*0.6,R.par*CFG.enemy.rageAt*cool);
  if(mode==='level'&&n<=5){R.rageAt=Math.max(R.rageAt,60);R.furyAt=Math.max(R.furyAt,R.rageAt+40);}
  return R;
}
const emptyCells=()=>R.cells.map((c,i)=>c?-1:i).filter(i=>i>=0);
function curInterval(){
  const c=R.mode==='level'?CFG.level:CFG.inf;
  let v=Math.max(c.minInt*(1+0.06*S.up.calm),R.interval*Math.pow(c.accel,Math.floor(R.t/c.accelEvery)));
  if(R.rage>=2)v*=CFG.enemy.furySpawn;
  if(R.t<R.slowUntil)v*=2;return v;
}
function spawnOne(){
  const e=emptyCells();if(!e.length)return -1;
  const i=e[Math.floor(Math.random()*e.length)];
  const cfgG=(R.mode==='level'?CFG.level.gold(R.w):CFG.inf.gold)+0.01*S.up.gold,cfgB=R.mode==='level'?CFG.level.bomb(R.w):CFG.inf.bomb;
  if(Math.random()<cfgB)R.cells[i]={k:'bomb'};
  else{const l=R.sL+(Math.random()<0.05*S.up.lucky?1:0);R.cells[i]={l};if(Math.random()<cfgG)R.cells[i].k='gold';noteLvl(l);}
  hooks.spawn(i);return i;
}
function noteLvl(l){if(l>R.best)R.best=l;if(l>S.maxLvl){const before=tierOf(S.maxLvl).sides;S.maxLvl=l;if(tierOf(l).sides!==before)hooks.evolve&&hooks.evolve();}}
/* ----- attaques de l'ennemi ----- */
const shapes=()=>R.cells.map((c,i)=>[c,i]).filter(x=>x[0]&&x[0].l);
function enemyAttack(){
  const E=R.E,kind=THEMES[E.th].atk,s=E.str,hit=[];
  if(Math.random()<0.06*S.up.dodge){hooks.dodge();return;}
  if(kind==='lock'){let e=emptyCells().sort(()=>Math.random()-.5);for(let k=0;k<s+1;k++){let i=e.pop();if(i==null){const sh=shapes().sort((a,b)=>a[0].l-b[0].l)[0];if(!sh)break;i=sh[1];}R.cells[i]={k:'lock'};hit.push(i);}}
  else if(kind==='burn'){shapes().sort((a,b)=>a[0].l-b[0].l).slice(0,s+1).forEach(([c,i])=>{R.cells[i]=null;hit.push(i);});}
  else if(kind==='fog'){shapes().sort(()=>Math.random()-.5).slice(0,2*s+1).forEach(([c,i])=>{c.fog=R.t+8;hit.push(i);});}
  else if(kind==='heal'){if(E.hp<E.max){E.hp=Math.min(E.max,E.hp+E.max*0.06*s);}else{const e=emptyCells();if(e.length){const i=e[0];R.cells[i]={k:'lock'};hit.push(i);}}}
  else if(kind==='shuffle'){const idx=R.cells.map((c,i)=>i).filter(i=>!R.cells[i]||R.cells[i].k!=='lock');const vals=idx.map(i=>R.cells[i]).sort(()=>Math.random()-.5);idx.forEach((i,k)=>R.cells[i]=vals[k]);shapes().filter(([c])=>c.l>R.sL).sort(()=>Math.random()-.5).slice(0,s).forEach(([c,i])=>{c.l--;hit.push(i);});}
  if(R.rage===2){const extra=s+Math.floor((R.t-R.furyAt)/15);let e=emptyCells().sort(()=>Math.random()-.5);for(let k=0;k<extra;k++){let i=e.pop();if(i==null){const sh=shapes().sort((x,y)=>x[0].l-y[0].l)[0];if(!sh)break;i=sh[1];}R.cells[i]={k:'lock'};hit.push(i);}}
  hooks.attack(kind,hit);
}
function enemyTick(dt){
  const E=R.E,C=CFG.enemy;
  if(E.type==='titan'){
    const k=Math.floor(R.t/CFG.titan.atkEvery);E.atkEvery=Math.max(CFG.titan.atkMin,CFG.titan.atk0*Math.pow(CFG.titan.atkDecay,k));E.str=1+Math.floor(R.t/CFG.titan.strEvery);
  }else{
    const rage=R.t>=R.furyAt?2:R.t>=R.rageAt?1:0;
    if(rage!==R.rage){R.rage=rage;hooks.phase(rage===2?'fury':'rage');}
    const base=E.phase===2?C.atk2:C.atk[E.type];
    E.atkEvery=rage===2?C.furyAtk:rage===1?base*0.5:base;
    if(rage===2)E.str=Math.max(E.str,C.str2);
  }
  const before=E.atkT;if(R.t>=R.frostUntil)E.atkT-=dt;if(E.atkT>E.atkEvery)E.atkT=E.atkEvery;
  if(before>C.windup&&E.atkT<=C.windup)hooks.windup();
  if(E.atkT<=0){E.atkT=E.atkEvery;enemyAttack();}
}
function runTick(dt){
  if(!R||R.paused||R.hold||R.state==='won'||R.state==='lost'||R.state==='dead')return;
  R.t+=dt;
  if(R.comboT>0){R.comboT-=dt;if(R.comboT<=0)R.combo=0;}
  for(const c of R.cells)if(c&&c.fog&&c.fog<=R.t)delete c.fog;
  if(R.state==='grace'){
    if(emptyCells().length){R.state='play';R.graceT=0;}
    else{R.graceT+=dt;if(R.graceT>=graceT()){R.state='dead';R.why='full';hooks.lose();}return;}
  }
  enemyTick(dt);if(R.state!=='play')return;
  if(R.t<R.freezeSpawnUntil)return;
  R.noPair=emptyCells().length<=2&&!findPair()&&!R.cells.some(x=>x&&(x.k==='joker'||x.k==='bomb'));
  R.spawnT+=dt;const iv=curInterval();
  while(R.spawnT>=iv){
    R.spawnT-=iv;
    if(spawnOne()<0){R.state='grace';R.graceT=0;R.spawnT=0;hooks.full();break;}
  }
}
const nb=i=>{const N=R.N,x=i%N,y=Math.floor(i/N),o=[];if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);return o;};
function applyDamage(into,d,crit){
  const E=R.E;R.dmg+=d;if(R.mode==='inf'){R.score+=d;const k=Math.floor(Math.log10(Math.max(1,R.score)));if(k>=4&&k>(R.mile||3)){R.mile=k;R.gold+=Math.round(Math.pow(2,k-4)*40);hooks.milestone(k);}}
  E.hp-=d;hooks.hit(into,d,false,crit);
  if(E.type==='boss'&&E.phase===1&&E.hp<=E.max/2&&E.hp>0){E.phase=2;E.shieldL=Math.max(1,R.power-CFG.enemy.shieldGap-S.up.pierce);E.str=CFG.enemy.str2;E.atkT=Math.min(E.atkT,CFG.enemy.atk2);hooks.phase('shield');}
  if(E.hp<=0&&R.state!=='won'){E.hp=0;R.state='won';hooks.win();}
}
function strike(into,l){
  const E=R.E;
  if(E.shieldL&&l<E.shieldL&&R.t>=R.breakUntil){hooks.hit(into,0,true);return;}
  let d=dmgOf(l)*(1+(CFG.dmg.combo+0.02*S.up.combo)*(R.combo-1))*(1+0.08*S.up.power)*(R.t<R.surgeUntil?2:1);
  const crit=Math.random()<0.03*S.up.crit;if(crit)d*=3;
  applyDamage(into,d,crit);
}
function doMerge(into,l,gold){
  R.cells[into]={l};if(gold)R.cells[into].k='gold';
  R.merges++;S.st.merges++;S.day.merges++;noteLvl(l);
  R.combo=Math.min(R.combo+1,24);R.comboT=1.4;if(R.combo>S.st.maxCombo)S.st.maxCombo=R.combo;if(R.combo>(S.day.combo||0))S.day.combo=R.combo;
  for(const id in R.jk)R.jk[id]=Math.min(jokerNeed(id),R.jk[id]+1);
  if(gold)R.gold+=CFG.reward.gold(l);
  for(const j of nb(into))if(R.cells[j]&&R.cells[j].k==='lock'){R.cells[j]=null;hooks.unlock(j);}
  hooks.merge(into,l,gold);
  strike(into,l);
  if(R.state==='won')return;
  if(Math.random()<0.05*S.up.chain){
    const k=R.cells.findIndex((c,i)=>i!==into&&c&&c.l===l&&c.k!=='lock');
    if(k>=0){const g2=R.cells[k].k==='gold';R.cells[k]=null;doMerge(into,l+1,gold||g2);}
  }
}
function runMove(a,b){
  if(!R||R.state==='won'||R.state==='lost'||R.state==='dead'||a===b)return 'none';
  const A=R.cells[a],B=R.cells[b];
  if(!A||A.k==='lock')return 'none';
  if(B&&B.k==='lock')return 'none';
  if(!B){R.cells[b]=A;R.cells[a]=null;return 'move';}
  if(A.k==='joker'&&B.l&&B.l<=jokerCap()){R.cells[a]=null;doMerge(b,B.l+1,B.k==='gold');return 'merge';}
  if(B.k==='joker'&&A.l&&A.l<=jokerCap()){R.cells[a]=null;doMerge(b,A.l+1,A.k==='gold');return 'merge';}
  if(A.l&&B.l&&A.l===B.l){R.cells[a]=null;doMerge(b,A.l+1,A.k==='gold'||B.k==='gold');return 'merge';}
  R.cells[a]=B;R.cells[b]=A;return 'swap';
}
function tapCell(i){
  const c=R.cells[i];
  if(c&&c.k==='bomb'){R.cells[i]=null;const hit=[i];for(const j of nb(i).concat(diag(i)))if(R.cells[j]&&R.cells[j].k!=='lock'){R.cells[j]=null;hit.push(j);}hooks.bomb(i,hit);return true;}
  return false;
}
const diag=i=>{const N=R.N,x=i%N,y=Math.floor(i/N),o=[];for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<N&&Y<N)o.push(Y*N+X);}return o;};
function useBooster(k,cell){
  if(!R||R.state==='won'||R.state==='dead')return false;
  if(k==='hammer'&&(cell==null||!R.cells[cell]))return false;
  if(S.boosters[k]<=0){const g=CFG.boosterGems[k];if(S.gems<g)return false;S.gems-=g;S.boosters[k]++;}
  if(k==='hammer'){R.cells[cell]=null;hooks.bomb(cell,[cell]);}
  else if(k==='glass'){R.slowUntil=R.t+CFG.slowBooster;}
  else if(k==='bolt'){applyDamage(null,dmgOf(R.best+1)*(1+0.08*S.up.power),false);}
  S.boosters[k]--;R.boostersUsed++;S.st.boosters++;
  if(R.state==='grace'&&emptyCells().length){R.state='play';R.graceT=0;}
  return true;
}
const jokerCap=()=>R.sL+1+(S.jk.chameleon||1);
function placeJokerPiece(){let e=emptyCells();let i;if(e.length)i=e[Math.floor(Math.random()*e.length)];else{i=R.cells.reduce((m,c,j)=>c&&c.l&&(m<0||c.l<R.cells[m].l)?j:m,-1);if(i<0)return -1;}R.cells[i]={k:'joker'};hooks.spawn(i);return i;}
function useJoker(id){
  if(!R||R.state!=='play'&&R.state!=='grace'||R.jk[id]==null||R.jk[id]<jokerNeed(id))return false;
  const l=S.jk[id]||1;R.jk[id]=0;S.st.jokerUses++;roll();S.day.jokers++;
  if(id==='chameleon'){placeJokerPiece();if(l>=4)placeJokerPiece();}
  else if(id==='magnet'){let n=2+l;while(n-->0&&R.state!=='won'){const seen={};let done=false;for(const [c,i] of shapes().sort((a,b)=>a[0].l-b[0].l)){if(c.fog)continue;if(seen[c.l]!=null){runMove(seen[c.l],i);done=true;break;}seen[c.l]=i;}if(!done)break;}}
  else if(id==='surge'){R.surgeUntil=R.t+6+2*l;}
  else if(id==='frost'){R.frostUntil=R.t+8+2*l;R.freezeSpawnUntil=R.t+3+l;}
  else if(id==='prism'){shapes().sort((a,b)=>a[0].l-b[0].l).slice(0,2+l).forEach(([c,i])=>{c.l++;noteLvl(c.l);hooks.spawn(i);});}
  else if(id==='meteor'){applyDamage(null,dmgOf(R.best+2)*(1+0.5*(l-1))*(1+0.08*S.up.power),false);}
  else if(id==='breaker'){R.breakUntil=R.t+8+3*l;}
  if(R.state==='grace'&&emptyCells().length){R.state='play';R.graceT=0;}
  hooks.joker(id);return true;
}
function continueRun(){
  if(!R||R.state!=='dead'||R.contUsed)return false;
  R.contUsed=true;
  const order=R.cells.map((c,i)=>[c,i]).filter(x=>x[0]&&x[0].k!=='lock').sort((a,b)=>(a[0].l||0)-(b[0].l||0));
  order.slice(0,CFG.cont.free).forEach(([c,i])=>R.cells[i]=null);
  R.E.atkT=R.E.atkEvery;R.slowUntil=R.t+CFG.cont.slow;R.state='play';R.graceT=0;R.spawnT=0;R.why='';return true;
}
function starsFor(){if(R.mode!=='level')return 0;return R.t<=R.par?3:R.t<=R.par*1.6?2:1;}
function runRewards(){

  if(R.mode==='level'){s=R.state==='won'?CFG.reward.win(R.n)*CFG.reward.star[starsFor()]:CFG.reward.win(R.n)*CFG.reward.lose*Math.min(1,R.dmg/R.E.max);}

}
function finishRun(){

    if(won){S.st.wins++;S.day.wins++;S.week.wins++;const st=starsFor();const k=String(R.n);if(st>(S.stars[k]||0))S.stars[k]=st;if(st===3){S.st.three++;S.day.three++;}if(R.n>=S.level)S.level=R.n+1;
      if(R.E.type!=='mob'){const b=S.bestiary[k];if(!b||R.t<b)S.bestiary[k]=Math.round(R.t);if(R.E.type==='boss')S.st.bosses++;else S.st.minis++;}}
  }else{S.st.inf++;S.week.inf++;S.day.inf++;const sc=Math.floor(R.score);if(sc>S.week.best)S.week.best=sc;if(sc>S.st.infBest)S.st.infBest=sc;}
  R.state=won?'won':'lost';R.reward=rew;S.adCount++;return rew;

let AC=null,musBus=null,sfxBus=null,delay=null;
function audio(){
  if(!S.settings.music&&!S.settings.sound)return null;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
      musBus=AC.createGain();musBus.gain.value=0.55;musBus.connect(comp);
      sfxBus=AC.createGain();sfxBus.gain.value=0.9;sfxBus.connect(comp);
      delay=AC.createDelay(1);delay.delayTime.value=0.375;const fb=AC.createGain();fb.gain.value=0.32;const wet=AC.createGain();wet.gain.value=0.35;
      delay.connect(fb).connect(delay);delay.connect(wet).connect(musBus);}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
  return AC;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // la m – fa – do – sol
const PENTA=[0,3,5,7,10];
const Music={on:false,step:0,next:0,timer:null,int:0.15,target:0.15,
  start(){const a=audio();if(!a||!S.settings.music||this.on)return;this.on=true;this.next=a.currentTime+0.1;this.step=0;this.timer=setInterval(()=>this.sched(),25);},
  stop(){this.on=false;clearInterval(this.timer);},
  key(){return R&&R.mode==='level'?worldInfo(R.w).k:0;},
  sched(){if(!AC)return;const spb=60/100/2;while(this.next<AC.currentTime+0.15){this.play(this.step,this.next);this.next+=spb;this.step++;}this.int+=(this.target-this.int)*0.05;},
  play(s,t){
    const k=this.key(),bar=Math.floor(s/8)%4,ch=PROG[bar].map(n=>n+k),i=this.int,pos=s%8;
    if(pos===0){ch.forEach((n,j)=>{pad(mtof(n),t,2.4,0.018);pad(mtof(n)*1.004,t,2.4,0.014);});}
    if(pos%4===0)pluck(mtof(ch[0]-24),t,0.5,'sine',0.13);
    const arpOn=i>0.45?true:pos%2===0;
    if(arpOn){const pat=[0,1,2,1,2,0,1,2];const n=ch[pat[pos]]+12+(i>0.7&&pos>=4?12:0);pluck(mtof(n),t,0.28,'triangle',0.045,true);}
    if(i>0.6&&pos%2===1)hat(t,0.012+0.01*(i-0.6));
    if(i>0.85&&pos===6)pluck(mtof(ch[2]+24),t,0.6,'sine',0.03,true);
  }
};
function pad(f,t,d,g){const o=AC.createOscillator(),v=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700+Music.int*900;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+0.5);v.gain.linearRampToValueAtTime(0,t+d);o.connect(lp).connect(v).connect(musBus);o.start(t);o.stop(t+d+0.05);}
function pluck(f,t,d,type,g,wet){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v);v.connect(musBus);if(wet)v.connect(delay);o.start(t);o.stop(t+d+0.05);}
let noiseBuf=null;
function hat(t,g){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.05,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),v=AC.createGain();s.buffer=noiseBuf;bp.type='highpass';bp.frequency.value=7000;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.connect(bp).connect(v).connect(musBus);s.start(t);}
function tone(f,d,type,g,delayS=0){const a=audio();if(!a||!S.settings.sound)return;const t=a.currentTime+delayS,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v).connect(sfxBus);o.start(t);o.stop(t+d+0.02);}
const sfx={
  merge(c){const k=Music.key(),deg=PENTA[(c-1)%5],oct=Math.floor((c-1)/5);const f=mtof(69+k+deg+12*Math.min(oct,2));tone(f,0.16,'triangle',0.13);tone(f*2,0.1,'sine',0.04);},
  click(){const k=Music.key();tone(mtof(81+k),0.045,'triangle',0.06);tone(mtof(93+k),0.06,'sine',0.03,0.02);},
  buy(){tone(660,0.08,'square',0.05);tone(990,0.1,'square',0.04,0.06);},
  chord(){[0,4,7,12].forEach((s,i)=>tone(mtof(69+Music.key()+s),0.35,'triangle',0.09,i*0.07));},
  win(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(mtof(69+Music.key()+s),0.4,'triangle',0.09,i*0.06));},
  low(){tone(80,0.7,'sawtooth',0.12);},

function spark(c,x,y,s){

/* Une gemme : couronne de facettes éclairées en haut à gauche, table claire, contour sombre, reflet, étincelle spectrale. */
function gemBody(c,r,n,h,sat,L0,t,seed,rot=0){

}

function drawMe(c,size,t,dt){
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,size,size);
  const s=size/190;c.scale(s,s);
  const tr=tierOf(S.maxLvl),h=skinHue(t),L=layers();
  fx.evolveT=Math.max(0,fx.evolveT-dt*0.8);
  // faisceau de lumière venu d'en haut
  const beam=c.createLinearGradient(0,0,0,150);beam.addColorStop(0,'rgba(255,228,170,.34)');beam.addColorStop(1,'rgba(255,228,170,0)');
  c.fillStyle=beam;c.beginPath();c.moveTo(80,0);c.lineTo(110,0);c.lineTo(150,150);c.lineTo(40,150);c.closePath();c.fill();
  // lumière décomposée au sol, à droite du socle
  c.save();c.globalCompositeOperation='lighter';
  SPEC.forEach((col,i)=>{c.fillStyle=`rgba(${col},.30)`;c.beginPath();c.moveTo(100,150);c.lineTo(190,142+i*7);c.lineTo(190,149+i*7);c.closePath();c.fill();});
  c.restore();
  // socle
  c.fillStyle='#080d22';c.beginPath();c.ellipse(95,154,52,13,0,0,7);c.fill();
  c.strokeStyle='rgba(255,228,170,.35)';c.lineWidth=2;c.beginPath();c.ellipse(95,151,52,13,0,Math.PI,0);c.stroke();
  // couches gagnées (mondes terminés) : éclats en orbite
  const bob=Math.sin(t*1.8)*4,ev=1+Math.sin(fx.evolveT*Math.PI)*0.3,R0=44*ev;
  for(let k=0;k<Math.min(2+L*2,10)*(L>0?1:0);k++){const a=t*(0.7+k*0.05)+k*2*Math.PI/Math.min(2+L*2,10);c.save();c.translate(95+Math.cos(a)*62,86+bob+Math.sin(a)*18);gemBody(c,6,4,(h+k*40)%360,80,55,t,k);c.restore();}
  c.save();c.translate(95,86+bob);c.rotate(Math.sin(t*0.6)*0.08);
  gemBody(c,R0,tr.sides||16,h,85,52,t,3,t*0.15);
  c.restore();
}
function drawFoeAt(c,size,t,E){

function cellAt(e){const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>=r.width||y>=r.height)return null;return {i:Math.floor(y/cell)*R.N+Math.floor(x/cell),x,y};}
cv.addEventListener('pointerdown',e=>{
  audio();Music.start();if(!R||R.paused)return;const h=cellAt(e);if(!h)return;
  tapStart={i:h.i,x:e.clientX,y:e.clientY};
  if(armed)return;
  const C=R.cells[h.i];if(!C||C.k==='lock')return;
  cv.setPointerCapture(e.pointerId);drag={from:h.i,x:h.x,y:h.y,over:h.i,moved:false};
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;const h=cellAt(e);drag.over=h?h.i:null;if(tapStart&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>8)drag.moved=true;});
cv.addEventListener('pointerup',e=>{
  const h=cellAt(e);
  if(armed){if(h&&tapStart&&h.i===tapStart.i){if(useBooster(armed,h.i)){armed=null;renderBoost();}}tapStart=null;return;}
  if(drag){
    if(!drag.moved&&h&&h.i===drag.from){tapCell(h.i);}
    else if(h){const res=runMove(drag.from,h.i);if(res==='merge'&&tutoStep===1)tutoNext();}
    drag=null;
  }
  tapStart=null;
});
cv.addEventListener('pointercancel',()=>{drag=null;tapStart=null;});

      const cls=(r.me?' me':'')+(i<5?' up':i>=25?' down':'');h+=`<div class="lg${cls}"><span class="rk">${i+1}</span><canvas width="52" height="52" data-mini="${r.sides}" data-hue="${r.me?'me':r.hue}"></canvas><span class="nm">${esc(r.name)}</span><span class="sc">${fmt(r.score)}</span>${r.me?'<span></span>':`<button class="rep" data-report="${i}" aria-label="Signaler le pseudo ${esc(r.name)}">${ic('flag')}</button>`}</div>`;});

    h+=`<div class="list">${OFFERS.map(o=>{const own=o.once&&o.once();const left=o.id==='starter'&&S.offerAt&&!S.starter?Math.max(0,S.offerAt+86400e3-Date.now()):0;return `<div class="offer slab"><span class="oart">${ic(OART[o.id][0],OART[o.id][1])}</span><div style="min-width:0"><b>${o.t}</b><p>${o.d}${left>0?` <span style="color:var(--beam)">Encore ${dur(left/1000)}.</span>`:''}</p></div><button class="b b-gold sm" data-offer="${o.id}" ${own?'disabled':''}>${own?'Acquis':o.price}</button></div>`;}).join('')}</div>`;
    h+=`<h2 class="sec">Avec des gemmes</h2><div class="gitems"><div class="gitem slab"><span class="oart">${ic('bolt','ie')}</span><b>Plein d'énergie</b><p>Remonte ta réserve à ${emax()}.</p><button class="b b-gem sm" data-gem="refill" ${S.gems<CFG.energy.refillGems?'disabled':''}>${ic('gem')}${CFG.energy.refillGems}</button></div>`;
    for(const k in CFG.boosterGems)h+=`<div class="gitem slab"><span class="oart">${ic(BICON[k],'ie')}</span><b>${BNAME[k]}</b><p>${BDESC[k]} ${S.boosters[k]} en stock.</p><button class="b b-gem sm" data-gem="${k}" ${S.gems<CFG.boosterGems[k]?'disabled':''}>${ic('gem')}${CFG.boosterGems[k]}</button></div>`;
    h+=`</div><h2 class="sec">Énergie gratuite<small>${CFG.energy.adPerDay-S.day.energyAds} restante${CFG.energy.adPerDay-S.day.energyAds>1?'s':''} aujourd'hui</small></h2><button class="b b-gold" style="width:100%" id="adEnergy" ${S.day.energyAds>=CFG.energy.adPerDay?'disabled':''}>${ic('tv')}Regarder une pub : +${CFG.energy.adGain} énergie</button>`;
    h+=`<h2 class="sec">Couleur de ta gemme</h2><div class="skins">`;
    SKINS.forEach(k=>{const has=S.skins.includes(k.id);h+=`<button class="skin" data-skin="${k.id}" aria-pressed="${S.skin===k.id}"><canvas width="80" height="80" data-mini="6" data-hue="${k.id==='prisme'?'prism':{cyan:192,rose:322,or:44}[k.id]}"></canvas>${k.label}<span>${has?(S.skin===k.id?'Portée':'Porter'):k.price+' gemmes'}</span></button>`;});

    h+=`<p class="note">${S.nameChanges===0?'Le premier changement est gratuit. ':''}Les pseudos passent un filtre automatique. Après 3 signalements, le pseudo redevient un nom aléatoire.</p><h2 class="sec">Réglages</h2><div class="list">`;
    h+=`<label class="switch slab">Musique<input type="checkbox" id="setMusic" ${S.settings.music?'checked':''}></label>`;
    h+=`<label class="switch slab">Effets sonores<input type="checkbox" id="setSound" ${S.settings.sound?'checked':''}></label>`;
    h+=`<label class="switch slab">Secousses et vibrations<input type="checkbox" id="setFx" ${S.settings.fx?'checked':''}></label></div>`;
