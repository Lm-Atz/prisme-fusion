    const bk=Object.keys(S.bestiary).map(Number).sort((a,b)=>a-b);
    h+=`<h2 class="sec">Bestiaire<small>${bk.length} vaincu${bk.length>1?'s':''}</small></h2><div class="list" style="gap:4px">${bk.length?bk.map(n=>{const e=enemyFor('level',n);return `<div class="best"><canvas width="88" height="88" style="width:44px;height:44px" data-foe="${n}"></canvas><span>${e.name}, niveau ${n}</span><span>record ${clock(S.bestiary[n])}</span></div>`;}).join(''):'<p class="note">Bats ton premier gardien au niveau 5 pour ouvrir le bestiaire.</p>'}</div>`;
    h+=`<h2 class="sec">Démo</h2><button class="b b-red" style="width:100%" id="resetBtn">Effacer ma progression</button>`;
  }
  p.innerHTML=h;
  p.querySelectorAll('canvas[data-foe]').forEach(m=>{drawFoeAt(m.getContext('2d'),88,0,enemyFor('level',+m.dataset.foe));});
  p.querySelectorAll('canvas[data-mini]').forEach(m=>{const hv=m.dataset.hue;drawMini(m,+m.dataset.mini,hv==='me'?skinHue(0):hv==='prism'?300:+hv);});
}
let atGroup='grid';
const grpReady=g=>S.build.length<S.slots&&ALLUP.some(u=>u.g===g&&!upLocked(u)&&!inBuild(u.id)&&S.shards>=upCost(u))||(g==='jok'&&JOKERS.some(j=>jokerAvail(j)&&!S.jk[j.id]&&S.shards>=j.sh));
const BDESC={hammer:'Détruit la gemme ou le bloc de ton choix.',bolt:'Frappe comme une gemme un niveau au-dessus de ta plus grosse.',glass:`Apparitions deux fois plus lentes pendant ${CFG.slowBooster} s.`};

/* ----- navigation accueil ----- */
function goTab(t){tab=t;renderTab();window.scrollTo(0,0);}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;audio();Music.start();goTab(b.dataset.tab);});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&!b.closest('#board')){audio();sfx.click();}},true);
$('pname').addEventListener('click',()=>goTab('profile'));
$('me').addEventListener('click',()=>goTab('profile'));
$('pillE').addEventListener('click',()=>{audio();energyInfo(false);});
$('pillG').addEventListener('click',()=>{audio();goTab('shop');});
function doBuild(id){const r=startBuild(id);if(r==='ok'){sfx.buy();toast(`${upById(id).t} : construction lancée`);}else if(r==='slots')toast('Tous les emplacements sont occupés');save();refresh();renderTab();return r;}
$('home').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;audio();Music.start();
  if(t.id==='playBtn')startLevel(S.level);
  else if(t.dataset.lvl)startLevel(+t.dataset.lvl);
  else if(t.id==='infBtn')startInf();
  else if(t.id==='collectBtn'){const before=S.shards;const g=collect();if(g){sfx.chord();save();renderTab();const cs=$('cS');cs.textContent=fmt(before);flyShards($('forgeRing'),cs,Math.min(8,2+Math.floor(Math.log10(g+1))));countUp(cs,before,S.shards,1000);setTimeout(refresh,1100);}}
  else if(t.dataset.build)doBuild(t.dataset.build);
  else if(t.dataset.updetail)upDetail(t.dataset.updetail);
  else if(t.dataset.rush){if(rushBuild(t.dataset.rush)){sfx.chord();}else toast('Pas assez de gemmes');save();refresh();renderTab();}
  else if(t.dataset.adb){const id=t.dataset.adb;rewarded(()=>{adBuild(id);toast('Construction accélérée de 30 minutes');renderTab();});}
  else if(t.id==='buySlot'){if(buySlot()){sfx.chord();toast('Nouvel emplacement de construction');}save();refresh();renderTab();}
  else if(t.id==='buyJSlot'){if(buyJSlot()){sfx.chord();toast('Nouvel emplacement de joker');}save();refresh();renderTab();}
  else if(t.dataset.grp){atGroup=t.dataset.grp;renderTab();}
  else if(t.dataset.unlock){const [id,c]=t.dataset.unlock.split(':');if(unlockJoker(id,c)){sfx.win();toast(`${jokerById(id).t} débloqué`);}save();refresh();renderTab();}
  else if(t.dataset.equip){if(!toggleEquip(t.dataset.equip))toast('Tous les emplacements de joker sont pris');save();renderTab();}
  else if(t.id==='goAtelier')goTab('atelier');
  else if(t.dataset.claim){const [k,i]=t.dataset.claim.split(':');if(claim(k,+i)){sfx.chord();toast('Récompense reçue');save();refresh();renderTab();}}
  else if(t.dataset.report){toast('Signalement envoyé');t.disabled=true;}
  else if(t.dataset.offer){const o=OFFERS.find(x=>x.id===t.dataset.offer);modal(`<div class="mart">${ic('bag','ie')}</div><h2>${o.t}</h2><p>${o.d}</p><div class="big" style="color:var(--beam)">${o.price}</div><p>Achat simulé : aucun paiement réel.</p><div class="acts"><button class="b b-gold" data-confirm="${o.id}">Confirmer l'achat</button><button class="b" data-close>Annuler</button></div>`);}
  else if(t.dataset.gem){if(buyGemItem(t.dataset.gem)){sfx.buy();save();refresh();renderTab();}}
  else if(t.id==='adEnergy'){rewarded(()=>{S.day.energyAds++;S.energy+=CFG.energy.adGain;toast(`+${CFG.energy.adGain} énergie`);renderTab();});}
  else if(t.dataset.skin){if(!buySkin(t.dataset.skin))toast('Pas assez de gemmes');else sfx.buy();save();refresh();renderTab();}
  else if(t.id==='nameBtn'){const r=rename($('nameIn').value);if(r.ok){toast('Pseudo mis à jour');save();refresh();renderTab();}else $('nameErr').textContent=r.msg;}
  else if(t.id==='resetBtn'){modal(`<h2>Effacer ta progression ?</h2><p>Tout sera remis à zéro : niveaux, améliorations, gemmes.</p><div class="acts"><button class="b b-red" data-doreset>Tout effacer</button><button class="b" data-close>Annuler</button></div>`);}
});
$('home').addEventListener('change',e=>{
  if(e.target.id==='setMusic'){S.settings.music=e.target.checked;if(S.settings.music)Music.start();else Music.stop();}
  if(e.target.id==='setSound')S.settings.sound=e.target.checked;
  if(e.target.id==='setFx')S.settings.fx=e.target.checked;save();
});

/* ----- partie ----- */
let gameOverShown=false,tutoStep=0,hpLagV=1,hintT=null;
function needEnergy(){energyInfo(true);}
function startLevel(n){if(!spendEnergy()){needEnergy();return;}newRun('level',n);enterGame();}
function startInf(){if(!spendEnergy()){needEnergy();return;}newRun('inf',0);enterGame();}
const WORLD_HINTS={2:'Blocs verrouillés : fusionne juste à côté pour les ouvrir.',3:'Gemmes dorées : elles rapportent des éclats en plus.',4:'Bombes : touche-les pour libérer de la place.'};
function showHint(txt,ms){const h=$('hint');h.textContent=txt;h.hidden=false;clearTimeout(hintT);if(ms)hintT=setTimeout(()=>h.hidden=true,ms);}
function enterGame(){
  save();refresh();gameOverShown=false;armed=null;hpLagV=1;fx.trauma=0;fx.pop={};fx.sq={};
  $('home').hidden=true;$('game').hidden=false;$('hint').hidden=true;
  const ew=R.mode==='level'?worldInfo(R.w):worldInfo(R.E.th+1);document.documentElement.style.setProperty('--wh',ew.col);
  $('goalE').textContent=R.mode==='level'?`Niveau ${R.n}, ${TYPE_LABEL[R.E.type].toLowerCase()}`:TYPE_LABEL.titan;
  $('goalT').textContent=R.E.name;$('hpWrap').classList.toggle('titan',R.E.type==='titan');
  bfx.nums=[];bfx.parts=[];bfx.embers=[];bfx.dieT=0;bfx.recoil=0;fx.shots=[];fx.beams=[];fx.parts=[];fx.rings=[];fx.floats=[];
  requestAnimationFrame(()=>{resize();});renderBoost();
  if(R.mode==='level'&&R.n===1&&!S.st.tuto){tutoStep=1;R.paused=false;R.hold=true;showHint('Glisse une gemme sur une gemme identique pour les fusionner.');}
  else{tutoStep=0;if(R.mode==='level'&&WORLD_HINTS[R.w]&&(S.st.hintW||1)<R.w){S.st.hintW=R.w;showHint(WORLD_HINTS[R.w],4500);}}
}
function tutoNext(){
  if(tutoStep===1){tutoStep=2;R.hold=false;R.paused=true;$('hint').hidden=true;
    modal(`<div class="mart" style="color:var(--s1)">${ic('swords')}</div><h2>Chaque fusion frappe</h2><p>Plus la gemme est grosse, plus le coup fait mal : les dégâts triplent à chaque niveau. Quand l'anneau rouge de l'ennemi se remplit, il attaque.</p><div class="acts"><button class="b b-gold" id="tutoGo">À l'attaque</button></div>`);}
}
function renderBoost(){
  if(!R)return;renderJok();
  const showB=S.level>=4||Object.values(S.boosters).some(n=>n>0);$('boost').hidden=!showB;$('toolSep').hidden=!showB||!Object.keys(R.jk).length;
  $('boost').innerHTML=['hammer','glass','bolt'].map(k=>{const n=S.boosters[k];return `<button class="tool" data-boost="${k}" aria-pressed="${armed===k}" aria-label="${BNAME[k]}"><span class="oc">${ic(BICON[k],'ie')}</span><span class="cnt ${n>0?'':'pay'}">${n>0?n:ic('gem')+CFG.boosterGems[k]}</span><small>${BNAME[k]}</small></button>`;}).join('');
}
$('boost').addEventListener('click',e=>{
  const b=e.target.closest('[data-boost]');if(!b||!R||R.paused)return;audio();const k=b.dataset.boost;
  if(S.boosters[k]<=0&&S.gems<CFG.boosterGems[k]){toast('Pas assez de gemmes');return;}
  if(k==='hammer'){armed=armed==='hammer'?null:'hammer';if(armed)toast('Touche la gemme à détruire');}
  else if(useBooster(k)){sfx.chord();kick('medium');toast(k==='glass'?'Apparitions ralenties':'Éclair');}
  renderBoost();save();
});
function renderJok(){
  const ids=Object.keys(R.jk);$('jok').hidden=!ids.length;
  $('jok').innerHTML=ids.map(id=>`<button class="tool jtool" data-jk="${id}" aria-label="${jokerById(id).t}"><span class="oc">${ic(JICON[id])}</span><small>${jokerById(id).t}</small></button>`).join('');
  updJok();
}
function updJok(){for(const id in R.jk){const need=jokerNeed(id),v=R.jk[id],b=document.querySelector(`[data-jk="${id}"]`);if(!b)continue;const ready=v>=need;b.classList.toggle('ready',ready);b.querySelector('.oc').style.setProperty('--p',(100*Math.min(1,v/need))+'%');b.querySelector('small').textContent=ready?'Prêt':jokerById(id).t;b.setAttribute('aria-label',`${jokerById(id).t} : ${ready?'prêt':v+' fusions sur '+need}`);}}
$('jok').addEventListener('click',e=>{const b=e.target.closest('[data-jk]');if(!b||!R||R.paused)return;audio();if(useJoker(b.dataset.jk)){save();}else toast('Pas encore chargé : fusionne pour le remplir');updJok();});
hooks.joker=id=>{const j=jokerById(id);sfx.chord();fx.glow=1;fx.flash=0.6;fx.flashCol='212,140,255';kick('large');bfx.nums.push({txt:j.t,t:0,x:BW/2,y:BH*0.85,col:'hsl(282 100% 80%)',big:true});};
hooks.milestone=k=>{toast(`Palier ${fmt(Math.pow(10,k))} de dégâts : bonus d'éclats`);sfx.win();kick('large');bfx.nums.push({txt:'Palier '+fmt(Math.pow(10,k)),t:0,x:BW/2,y:BH*0.85,col:'hsl(44 100% 66%)',big:true});};
hooks.dodge=()=>{bfx.nums.push({txt:'Esquivé',t:0,x:BW/2,y:BH*0.9,col:'hsl(150 100% 72%)'});sfx.tick();};
$('quit').addEventListener('click',()=>{if(!R||R.state==='won'||R.state==='lost')return;modal(`<h2>Abandonner le combat ?</h2><p>L'énergie dépensée ne sera pas rendue.</p><div class="acts"><button class="b b-gold" data-close>Continuer à jouer</button><button class="b b-red" id="doQuit">Abandonner</button></div>`);});
hooks.win=()=>{enemyBurst(60,null,320);enemyBurst(24,44,220);fx.flash=1;fx.flashCol='255,200,87';for(let i=0;i<R.N*R.N;i++)if(R.cells[i])fx.burst(i,null,5,320);kick('huge');sfx.win();setTimeout(()=>endScreen(),1100);};
hooks.lose=()=>{sfx.low();kick('large');fx.flash=1;fx.flashCol='255,90,110';setTimeout(()=>{if(!R.contUsed)continueOffer();else endScreen();},500);};
function continueOffer(){
  gameOverShown=true;
  modal(`<div class="mart" style="color:var(--danger)">${ic('grid')}</div><h2>Plateau saturé</h2><p>Une seule fois par combat : ${CFG.cont.free} petites gemmes disparaissent, l'ennemi recharge son attaque et les apparitions ralentissent ${CFG.cont.slow} secondes.</p><div class="acts">
    <button class="b b-gold" id="contAd">${ic('tv')}Continuer avec une pub</button><button class="b b-gem" id="contGem" ${S.gems<CFG.cont.gems?'disabled':''}>${ic('gem')}Continuer pour ${CFG.cont.gems}</button><button class="b" id="contNo">Terminer le combat</button></div>`);
}
function endActs(won){
  let h=`<div class="acts">`;
  if(R.mode==='level'&&won)h+=`<button class="b b-gold" id="nextLvl">Niveau ${R.n+1}<small style="margin-left:6px">${ic('bolt')}${CFG.energy.cost}</small></button>`;
  else h+=`<button class="b b-gold" id="retry">Rejouer<small style="margin-left:6px">${ic('bolt')}${CFG.energy.cost}</small></button>`;
  return h+`<button class="b" id="toHome">Accueil</button></div>`;
}
function endScreen(){
  gameOverShown=true;const won=R.state==='won';const rew=finishRun();const st=starsFor();
  let h='';
  if(R.mode==='level')h=won?`<div class="stars">${starsHtml(st)}</div><h2>${R.E.name} vaincu</h2><p>En ${clock(R.t)}. Trois étoiles sous ${clock(R.par)}.</p>`:`<div class="mart" style="color:var(--danger)">${ic('breaker')}</div><h2>${R.E.name} a gagné</h2><p>Tu lui as retiré ${Math.floor(100*Math.min(1,R.dmg/R.E.max))} % de ses PV.</p>`;
  else h=`<div class="mart" style="color:var(--s1)">${ic('flame')}</div><h2>${R.E.name}</h2><div class="big">${fmt(R.score)}</div><p>${Math.floor(R.score)>=S.week.best?'Nouveau record de la semaine':'Record de la semaine : '+fmt(S.week.best)}${R.mile?` · palier ${fmt(Math.pow(10,R.mile))} atteint`:''}</p>`;
  h+=`<div class="loot" id="lootLine">${ic('shard')}<span id="lootN">0</span></div>${(R.mode!=='level'||R.n>=5)?`<div class="acts"><button class="b b-shard" id="dbl">${ic('tv')}Doubler le butin</button></div>`:''}`+endActs(won);
  modal(h);save();refresh();
  const ln=$('lootN');if(ln){if(motionOK()){for(let i=0;i<Math.min(8,2+Math.floor(Math.log10(rew+1)));i++){const el=document.createElement('div');el.className='fly';el.innerHTML=ic('shard','is');document.body.appendChild(el);const b=ln.getBoundingClientRect(),sx=innerWidth/2+rnd(-100,100),sy=innerHeight*0.25+rnd(-40,40),t0=performance.now()+i*60;const step=now=>{const k=Math.max(0,Math.min(1,(now-t0)/450));const e=1-Math.pow(1-k,2);el.style.transform=`translate(${sx+(b.left+b.width/2-sx)*e-12}px,${sy+(b.top+b.height/2-sy)*e-12}px)`;if(k<1)requestAnimationFrame(step);else el.remove();};requestAnimationFrame(step);}}countUp(ln,0,rew,900);}
}
function leaveGame(after){
  const needAd=!S.noAds&&S.adCount>=CFG.interstitialEvery;
  const go=()=>{R=null;$('game').hidden=true;$('home').hidden=false;Music.target=0.15;tab='home';renderTab();refresh();if(after){after();return;}homeMoments();};
  if(needAd){S.adCount=0;save();showAd(go,'Publicité entre deux combats');}else go();
}
$('modal').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;audio();
  if(t.hasAttribute('data-close'))closeModal();
  else if(t.dataset.build){doBuild(t.dataset.build);closeModal();}
  else if(t.dataset.confirm){purchase(t.dataset.confirm);closeModal();sfx.chord();toast('Achat simulé effectué');save();refresh();renderTab();}
  else if(t.hasAttribute('data-doreset')){S=fresh();closeModal();save();tab='home';renderTab();refresh();}
  else if(t.id==='mAd'){closeModal();rewarded(()=>{S.day.energyAds++;S.energy+=CFG.energy.adGain;toast(`+${CFG.energy.adGain} énergie`);renderTab();});}
  else if(t.id==='mRefill'){buyGemItem('refill');closeModal();save();refresh();renderTab();}
  else if(t.id==='tutoGo'){S.st.tuto=true;tutoStep=0;save();closeModal();}
  else if(t.id==='nameGo'){const v=$('nameIn').value;if(v.trim()===S.name){closeModal();return;}const r=rename(v);if(r.ok){closeModal();toast('Pseudo enregistré');save();refresh();renderTab();}else $('nameErr').textContent=r.msg;}
  else if(t.id==='loginGo'){const r=claimLogin();closeModal();if(r){toast('Récompense du jour reçue');sfx.win();}save();refresh();renderTab();}
  else if(t.id==='doQuit'){R.state='dead';R.contUsed=true;closeModal();endScreen();}
  else if(t.id==='contAd'){closeModal();showAd(()=>{roll();S.day.ads++;continueRun();gameOverShown=false;R.paused=false;save();});}
  else if(t.id==='contGem'){if(S.gems<CFG.cont.gems)return;S.gems-=CFG.cont.gems;continueRun();gameOverShown=false;closeModal();R.paused=false;save();refresh();}
  else if(t.id==='contNo'){closeModal();endScreen();}
  else if(t.id==='dbl'){t.disabled=true;const add=R.reward;closeModal();showAd(()=>{roll();S.day.ads++;S.shards+=add;R.reward+=add;toast(`+${fmt(add)} éclats`);save();refresh();reopenEnd();});}
  else if(t.id==='nextLvl'){const n=R.n+1;closeModal();leaveGame(()=>startLevel(n));}
  else if(t.id==='retry'){const m=R.mode,n=R.n;closeModal();leaveGame(()=>m==='level'?startLevel(n):startInf());}
  else if(t.id==='toHome'){closeModal();leaveGame();}
});
function countUp(el,from,to,ms=900){const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
function flyShards(fromEl,toEl,n,onEach){
  if(!fromEl||!toEl||!motionOK()){if(onEach)for(let i=0;i<n;i++)onEach();return;}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,bx=b.left+b.width/2,by=b.top+b.height/2;
  for(let i=0;i<n;i++){const el=document.createElement('div');el.className='fly';el.innerHTML=ic('shard','is');document.body.appendChild(el);
    const sx=ax+rnd(-40,40),sy=ay+rnd(-30,30),cx=(sx+bx)/2+rnd(-80,80),cy2=Math.min(sy,by)-rnd(40,120),t0=performance.now()+i*45,D=520;
    const step=now=>{const k=Math.max(0,Math.min(1,(now-t0)/D));if(k<=0){requestAnimationFrame(step);return;}const u=1-k,x=u*u*sx+2*u*k*cx+k*k*bx,y=u*u*sy+2*u*k*cy2+k*k*by;el.style.transform=`translate(${x-12}px,${y-12}px) scale(${1.2-0.5*k})`;el.style.opacity=k>0.9?String((1-k)*10):'1';if(k<1)requestAnimationFrame(step);else{el.remove();if(onEach)onEach();}};
    requestAnimationFrame(step);}
}
function homeMoments(){
  if(S.st.wins>=1&&S.nameChanges===0&&!S.st.namePrompted){S.st.namePrompted=true;save();
    modal(`<div class="mart" style="color:var(--gem)">${ic('gem')}</div><h2>Première victoire</h2><p>Choisis le nom que les autres joueurs verront en ligue. Ce premier changement est gratuit.</p><div class="field"><input id="nameIn" maxlength="16" value="${esc(S.name)}" aria-label="Ton pseudo"></div><p class="err" id="nameErr"></p><div class="acts"><button class="b b-gold" id="nameGo">Garder ce nom</button><button class="b" data-close>Plus tard</button></div>`);
    const inp=$('nameIn');inp.select();return;}
  if(!S.starter&&!S.offerAt&&(S.st.games>=2||S.energy<CFG.energy.cost)){S.offerAt=Date.now();save();starterModal();return;}
}
function starterModal(){
  const left=S.offerAt?Math.max(0,S.offerAt+86400e3-Date.now()):0;
  modal(`<div class="mart">${ic('box','ie')}</div><h2>Pack de départ</h2><p>150 gemmes, 30 énergie et 3 marteaux pour 1,99 €. Une seule fois.</p>${left>0?`<p class="tm" style="color:var(--beam);font-weight:800">Offre visible encore ${dur(left/1000)}</p>`:''}<div class="acts"><button class="b b-gold" data-confirm="starter">1,99 € (achat simulé)</button><button class="b" data-close>Non merci</button></div>`);
}
function reopenEnd(){modal(`<h2>Butin doublé</h2><div class="loot">${ic('shard')}+${fmt(R.reward)}</div>`+endActs(R.state==='won'));}

/* ================= boucle ================= */
let last=performance.now(),uiT=0,saveT=0,lastStars=-1;
const meC=$('me').getContext('2d'),foeC=$('foe').getContext('2d');
function frame(now){
  let dt=Math.min((now-last)/1000,0.1);last=now;const t=now/1000;
  if(now<fx.stopUntil)dt*=0.05;
  if(R&&!$('game').hidden){
    runTick(dt);drawBoard(dt,t);drawEnemy(dt,t);
    const E=R.E;
    if(E.type==='titan'){$('hpBar').style.width='100%';$('hpLag').style.width='0';$('hpTxt').textContent='Dégâts '+fmt(R.score);}
    else{const v=Math.max(0,E.hp)/E.max;if(v>hpLagV)hpLagV=v;else if(t-lastHitT>0.35)hpLagV+=(v-hpLagV)*Math.min(1,dt*5);
      $('hpBar').style.width=(100*v)+'%';$('hpLag').style.width=(100*hpLagV)+'%';$('hpTxt').textContent=fmt(Math.max(0,Math.ceil(E.hp)))+' / '+fmt(E.max)+(E.type==='boss'?(E.phase===1?', phase 1':', phase 2'):'');}
    $('atkBar').style.width=(100*(1-Math.max(0,E.atkT)/E.atkEvery))+'%';
    const bs=$('bstat');bs.className=R.rage?'rage':E.shieldL?'shield':'';
    bs.textContent=R.rage===2?'Furie : il attaque toutes les '+E.atkEvery.toFixed(1)+' s':R.rage===1?'Rage : attaques deux fois plus rapides':E.shieldL?`Bouclier : gemmes niv. ${E.shieldL} et plus`:E.type==='titan'?`Attaque toutes les ${E.atkEvery.toFixed(0)} s, force ${E.str}`:'Il '+THEMES[E.th].atkT;
    const fill=R.cells.filter(Boolean).length/R.cells.length;
    Music.target=Math.min(1,Math.max(fill*1.1,R.combo/6,0.25,R.rage?0.9:0,R.E.phase===2?0.75:0));
    $('clock').textContent=clock(R.t);
    const s=R.mode==='level'?starsFor():-2;if(s!==lastStars){lastStars=s;$('clockS').innerHTML=s>=0?[0,1,2].map(k=>ic('star',k<s?'':'off')).join(''):'';}
    const w=$('warn');if(R.state==='grace'){w.hidden=false;w.className='warn';w.textContent='Plateau plein ! '+Math.ceil(graceT()-R.graceT);}else if(R.noPair&&R.state==='play'){w.hidden=false;w.className='warn soft';w.textContent='Aucune fusion possible';}else w.hidden=true;
    updJok();
  }else if(!$('home').hidden&&tab==='home'){drawMe(meC,380,t,dt);drawFoeAt(foeC,168,t,enemyFor('level',S.level));}
  uiT+=dt;if(uiT>0.5){uiT=0;if(!$('home').hidden)refresh();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(R&&R.state==='play'&&!R.paused&&$('veil').hidden){R.paused=true;modal(`<h2>Pause</h2><div class="acts"><button class="b b-gold" data-close>Reprendre</button></div>`);}}});

  setTab(t){tab=t;renderTab();},renderBoost,startLevel,startInf};
load();regen();accrue();roll();renderTab();refresh();requestAnimationFrame(frame);
if(S.st.games>0)setTimeout(()=>{if($('veil').hidden)loginModal();},400);
})();
