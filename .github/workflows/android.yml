name: Android APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm i --ignore-scripts --no-audit --no-fund
      - run: mkdir -p www && cp index.html www/index.html && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prisme-fusion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
